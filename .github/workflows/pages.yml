# Publie la vitrine produit sur GitHub Pages.
#
# CE DEPOT EST UN MIROIR. La source est le GitLab Cerema (mcp/gristcoder_mcp) ;
# GitHub recoit un push mirror. Rien ne doit donc etre commite ici directement :
# un commit local serait ecrase au prochain miroitage. Un push de miroir reste un
# push authentifie ordinaire, il declenche bien ce workflow.
#
# PREALABLE MANUEL, une seule fois : Settings > Pages > Source = "GitHub Actions".
# Sans cela, le job deploy echoue sur un environnement github-pages inexistant.
name: Vitrine

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "grist_coder.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # La date de mise a jour se lit dans l'historique git. Sans historique
          # complet, elle serait vide et la page ne daterait plus rien.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verifier les regles de la vitrine
        run: node --test site/generate.test.mjs
      - name: Generer la vitrine
        run: node site/generate.mjs
      - name: Verifier que le depot est a jour
        # dist/ est versionne : s'il differe de ce que le generateur produit,
        # c'est que quelqu'un a edite le HTML a la main ou oublie de regenerer.
        run: git diff --exit-code -- site/dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
