apiVersion: v2
name: grist-coder
description: |
  Serveur MCP GristCoder — transforme un document Grist en application metier
  complete via IA (tables, formules, artefacts HTML/React, webhooks).
  Mode HTTP streamable, garde Bearer + owner-lock, connecteur OAuth 2.1 embarque
  (adosse a la cle API Grist), config LLM SSPCloud auto.
  Package self-hosted par-utilisateur pour le catalogue Onyxia SSPCloud :
  chaque utilisateur deploie son pod, garde ses propres secrets, l'auteur
  du chart n'est depositaire d'aucun secret.
type: application
version: 0.5.1
appVersion: "5.14"
icon: https://grist.numerique.gouv.fr/favicon.ico
keywords:
  - mcp
  - grist
  - llm
  - low-code
  - sspcloud
  - onyxia
home: https://nic01asfr.github.io/GristCoder/
sources:
  - https://github.com/nic01asFr/GristCoder
maintainers:
  - name: Nicolas LAVAL
    email: laval.nicolas13@gmail.com
# Meme bibliotheque et meme version que les autres services du catalogue (n8n-onyxia) :
# c'est elle qui produit l'ingress, la route et les politiques reseau a partir des
# valeurs standard, et qui les suspend quand Onyxia met le service en pause.
dependencies:
  - name: library-chart
    version: 2.1.7
    repository: https://inseefrlab.github.io/helm-charts-interactive-services
