# Valeurs par defaut du chart grist-coder (Onyxia SSPCloud, self-hosted par-user).
# Le serveur MCP est stateless (sessions in-memory, re-register auto) : pas de PVC.
# Aucun secret n'est commite ici ; les secrets naissent dans le namespace du user.
#
# Les blocs ingress, route, security.allowlist, security.networkPolicy, networking
# et global suivent les conventions du library-chart InseeFrLab : ce sont eux que
# lisent ses templates, et ce qui fait que le service se comporte comme les autres
# services du catalogue (hote tire du contexte Onyxia, protection IP, pause).

# --- Image ---------------------------------------------------------------------
# Pas de registre conteneur sur l'instance CI -> image hebergee sur un registre
# externe public (ghcr.io par defaut). repository est REECRIT au packaging
# par la CI avec la variable $IMAGE_REPO — la CI remplace toute ligne
# « repository: » de ce fichier : ne pas en ajouter d'autre.
image:
  repository: ghcr.io/nic01asfr/grist-coder
  # Vide = Chart.AppVersion (aligne server.json / ghcr). "latest" reste possible en override.
  tag: ""
  pullPolicy: Always

# --- Identite Onyxia -----------------------------------------------------------
onyxia:
  friendlyName: "GristCoder MCP"
  chartIconUrl: https://grist.numerique.gouv.fr/favicon.ico

# ONYXIA_USER est renseigne automatiquement par Onyxia (values.schema.json).
onyxia_user: ""

# --- Instance Grist ------------------------------------------------------------
grist:
  # Instance Grist cible. Sert aussi de liste blanche : le pod ne verifie une
  # identite qu'aupres de ce site (voir GRIST_SITE_URL cote serveur).
  siteUrl: "https://grist.numerique.gouv.fr"
  # Cle API Grist (optionnelle) : le widget utilise getAccessToken cote navigateur ;
  # une cle server-side sert aux clients MCP en Bearer statique et aux operations
  # owner (webhooks). Si elle est renseignee et que security.ownerUid est vide,
  # son compte devient le proprietaire du pod. Reste dans TON Secret, sur TON pod.
  # Le connecteur OAuth n'en a PAS besoin : la cle recueillie au consentement
  # voyage scellee dans le token.
  #   Grist -> Parametres du profil -> API -> Creer une cle
  apiKey: ""

# --- Securite ------------------------------------------------------------------
security:
  # Identifiant numerique Grist du proprietaire (Grist -> Parametres du profil).
  # RECOMMANDE : sans lui (ni grist.apiKey), le proprietaire est le premier compte
  # VERIFIE qui s'enregistre apres chaque demarrage — un collaborateur qui ouvrirait
  # le widget le premier apres un redemarrage prendrait le pod.
  ownerUid: ""
  # Verrou proprietaire : seul le proprietaire peut utiliser le pod. "off"
  # uniquement pour un pod volontairement partage.
  ownerLock: "on"
  # Protection par liste d'IP (library-chart : annotation whitelist-source-range).
  allowlist:
    enabled: false
    ip: "0.0.0.0/0"
  # NetworkPolicy (library-chart) : seuls le namespace et l'ingress atteignent le pod.
  networkPolicy:
    enabled: false
    from: []

# --- Garde du pod (auto-generee) -----------------------------------------------
# Un FILTRE, pas un secret : elle voyage dans l'URL du widget, stockee dans les
# options de section de chaque document qui l'integre. Lancee depuis Onyxia, elle
# vient de {{service.oneTimePassword}} : la meme valeur alimente le Secret et les
# notes, qui affichent donc l'URL complete du widget. Hors Onyxia, vide -> tiree au
# sort et conservee entre upgrades (lookup du Secret existant).
appAuth:
  token: ""

# --- Configuration LLM ---------------------------------------------------------
# Lancee depuis Onyxia, la configuration est reprise du profil « Assistant IA » de
# l'utilisateur, sous ses deux formats : historique (user.profile.aiAssistant.*,
# dans apiKey/baseUrl/model) et recent ({{ai.activeProvider.*}}, dans provider.*).
# Le template prend la premiere valeur non vide ; a defaut, les valeurs ci-dessous.
llm:
  apiKey: ""
  baseUrl: "https://llm.lab.sspcloud.fr/api"
  # Teste bon pour le tool-calling (appel emis ET resultat exploite) :
  # qwen3-6-35b-moe, qwen3-cursor, gemma4-26b-moe. Verifier avec GET {baseUrl}/v1/models.
  model: "qwen3-6-35b-moe"
  provider:
    apiKey: ""
    apiBase: ""
    selectedModel: ""
  # Dernier repli : lecture du Secret *-secretassistant du datalab au demarrage
  # (necessite rbac.create et un Secret present dans le namespace).
  autoFromDatalab: true

# Liste blanche d'hotes autorises par le proxy LLM (CSV). Doit contenir l'hote LLM.
llmProxyAllowedHosts: "llm.lab.sspcloud.fr,albert.api.etalab.gouv.fr"

# --- Serveur -------------------------------------------------------------------
app:
  port: 8742
  logLevel: info
  # Nombre de sauts de proxy de confiance (ingress onyxia = 1).
  trustProxy: 1

# --- Reseau (library-chart) ----------------------------------------------------
networking:
  type: ClusterIP
  service:
    port: 8742

# --- Ingress (library-chart) ---------------------------------------------------
# hostname, ingressClassName et cert-manager sont remplis par Onyxia depuis le
# contexte de la region. Hors Onyxia, renseigner au moins ingress.hostname.
ingress:
  enabled: true
  tls: true
  ingressClassName: ""
  hostname: ""
  useCertManager: false
  certManagerClusterIssuer: ""
  annotations:
    # SSE : pas de mise en tampon nginx sur le flux d'evenements.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

# --- Route OpenShift (library-chart) -------------------------------------------
route:
  enabled: false
  hostname: ""
  annotations: {}
  tls:
    termination: edge
  wildcardPolicy: None

# --- RBAC (lecture du Secret AI Assistant du datalab) --------------------------
# ServiceAccount dedie + RoleBinding vers la ClusterRole 'edit' (lecture des
# Secrets), pour le repli llm.autoFromDatalab. RoleBinding vers une ClusterRole
# EXISTANTE : autorise en namespace utilisateur SSPCloud.
rbac:
  create: true
  clusterRole: edit

# --- Securite pod (contraintes SSPCloud) ---------------------------------------
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# --- Ressources ----------------------------------------------------------------
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# --- Pause Onyxia (library-chart) ----------------------------------------------
# suspend = 0 replique et plus d'ingress : le bouton « Suspendre » d'Onyxia.
global:
  suspend: false

# --- Sondes --------------------------------------------------------------------
# /health est public (sans garde) -> httpGet possible.
probes:
  liveness:
    enabled: true
    path: /health
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    enabled: true
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
