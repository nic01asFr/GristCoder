apiVersion: v1
kind: Service
metadata:
  name: {{ include "grist-coder.fullname" . }}
  labels:
    {{- include "grist-coder.labels" . | nindent 4 }}
spec:
  type: {{ .Values.networking.type }}
  ports:
    # networking.service.port : c'est ce port que vise l'ingress du library-chart.
    - port: {{ .Values.networking.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "grist-coder.selectorLabels" . | nindent 4 }}
