apiVersion: v1
kind: Secret
metadata:
  name: {{ include "grist-coder.fullname" . }}
  labels:
    {{- include "grist-coder.labels" . | nindent 4 }}
  annotations:
    # keep : les secrets survivent aux upgrades / uninstall (souverainete user).
    helm.sh/resource-policy: keep
type: Opaque
data:
  # Garde Bearer du pod (auto-generee, stable via lookup).
  APP_AUTH_TOKEN: {{ include "grist-coder.appAuthToken" . | b64enc | quote }}
  # Cle API Grist (optionnelle, fournie par le user via le formulaire Onyxia).
  GRIST_API_KEY: {{ .Values.grist.apiKey | b64enc | quote }}
  # Cle API LLM : profil Assistant IA (historique ou recent), sinon vide -> le pod
  # tente le datalab au demarrage (llm.autoFromDatalab).
  LLM_API_KEY: {{ include "grist-coder.llmKey" . | b64enc | quote }}
