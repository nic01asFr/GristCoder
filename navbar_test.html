<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><title>Navbar Test</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f1f5f9; padding: 40px 32px; display: flex; flex-direction: column; gap: 48px; }
h2 { font-size: .72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: #94a3b8; margin-bottom: 10px; }
.demo { border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.10); }
.fake-content { height: 80px; background: #f8fafc; display: flex; align-items: center; justify-content: center; color: #94a3b8; font-size: .8rem; border-top: 1px solid #e2e8f0; }

.navbar {
  height: 40px; background: #fff; border-bottom: 1px solid #e2e8f0;
  display: flex; align-items: center; gap: 10px; padding: 0 12px;
}

/* ── Brand : < · dot · > Coder ── */
.n-brand {
  display: flex; align-items: center; gap: 5px;
  font-size: .82rem; font-weight: 700; color: #3e5de7;
  padding-right: 12px; border-right: 1px solid #e2e8f0; flex-shrink: 0;
}
.n-brackets {
  display: flex; align-items: center; gap: 3px;
}

/* dot — cliquable pour copier token quand connecté */
.n-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: #ef4444; /* off par défaut */
  flex-shrink: 0; transition: background .3s;
}
.n-dot.on {
  background: #10b981;
  cursor: pointer;
  box-shadow: 0 0 0 2px rgba(16,185,129,.18);
}
.n-dot.on:hover {
  box-shadow: 0 0 0 3px rgba(16,185,129,.28);
}

.spacer { flex: 1; }

/* artefact select */
.n-sel {
  padding: 3px 7px; border-radius: 6px; border: 1px solid #e2e8f0;
  background: #f8fafc; color: #1e293b; font-size: .78rem; font-family: inherit;
  max-width: 150px;
}
.n-sel:focus { outline: none; border-color: #3e5de7; }

/* panel toggle */
.n-btn {
  display: flex; align-items: center; justify-content: center;
  width: 30px; height: 28px;
  border-radius: 6px; border: 1px solid #e2e8f0;
  background: #3e5de7; color: #fff; cursor: pointer;
  transition: all .15s; flex-shrink: 0;
}
.n-btn:hover { background: #2845c1; }
.n-btn.off { background: #fff; color: #64748b; }
.n-btn.off:hover { background: #f8fafc; color: #1e293b; }
</style>
</head>
<body>

<!-- Panel ouvert -->
<div>
  <h2>Panel ouvert — dot cliquable (connecté)</h2>
  <div class="demo">
    <nav class="navbar">
      <div class="n-brand">
        <div class="n-brackets">
          <!-- < -->
          <svg width="7" height="14" viewBox="0 0 12 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="8 6 2 12 8 18"/>
          </svg>
          <!-- dot statut / copier token -->
          <div class="n-dot on" title="Connecté · cliquer pour copier token MCP"></div>
          <!-- > -->
          <svg width="7" height="14" viewBox="12 0 12 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 18 22 12 16 6"/>
          </svg>
        </div>
        Coder
      </div>

      <div class="spacer"></div>

      <select class="n-sel"><option>Test</option><option>Dashboard</option></select>

      <button class="n-btn" title="Fermer panel code">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
    </nav>
    <div class="fake-content">contenu widget</div>
  </div>
</div>

<!-- Panel fermé -->
<div>
  <h2>Panel fermé</h2>
  <div class="demo">
    <nav class="navbar">
      <div class="n-brand">
        <div class="n-brackets">
          <svg width="7" height="14" viewBox="0 0 12 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="8 6 2 12 8 18"/>
          </svg>
          <div class="n-dot on" title="Connecté · cliquer pour copier token MCP"></div>
          <svg width="7" height="14" viewBox="12 0 12 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 18 22 12 16 6"/>
          </svg>
        </div>
        Coder
      </div>

      <div class="spacer"></div>

      <button class="n-btn off" title="Ouvrir panel code">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </button>
    </nav>
    <div class="fake-content">contenu widget</div>
  </div>
</div>

<!-- Déconnecté -->
<div>
  <h2>Déconnecté — dot rouge, non cliquable</h2>
  <div class="demo">
    <nav class="navbar">
      <div class="n-brand">
        <div class="n-brackets">
          <svg width="7" height="14" viewBox="0 0 12 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="8 6 2 12 8 18"/>
          </svg>
          <div class="n-dot" title="Déconnecté"></div>
          <svg width="7" height="14" viewBox="12 0 12 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 18 22 12 16 6"/>
          </svg>
        </div>
        Coder
      </div>

      <div class="spacer"></div>

      <button class="n-btn off" title="Ouvrir panel code">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </button>
    </nav>
    <div class="fake-content">contenu widget</div>
  </div>
</div>

</body>
</html>
