# CI GitLab CEREMA — distribution GristCoder MCP pour Onyxia SSPCloud.
#
# Deux livrables, hebergees sur ce projet GitLab (public, id 3099) :
#   1. Image conteneur -> registre conteneur GitLab ($CI_REGISTRY_IMAGE).
#   2. Chart Helm       -> registre Helm GitLab (canal stable), pull anonyme.
#
# La CI reecrit image.repository du chart avec $CI_REGISTRY_IMAGE au packaging :
# le chart publie pointe donc TOUJOURS sur l'image reellement poussee.
#
# Pipelines :
#   - validate   : sur les MR (verdict avant merge), sur master et sur tags v*.
#   - build/publish : sur master et tags v* — image :latest + :<appVersion> (docstring
#     grist_coder.py, doit correspondre a server.json et Chart appVersion).

# workflow:rules -> evite les pipelines en double (une MR ne cree pas AUSSI un
# pipeline de branche). Pipeline seulement pour : tag, evenement MR, push master.
workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"

# Les runners de l'instance CEREMA sont TAGGES (cerema-apps, k8-runner) et ne
# prennent pas les jobs non-taggees. On cible le pool applicatif cerema-apps
# (executeur k8s, compatible images kaniko/helm/python) pour tous les jobs.
default:
  tags:
    - cerema-apps

stages:
  - validate
  - build-image
  - publish-chart

# ── 0. Validation chart (helm lint + template smoke) ───────────────────────────
lint-chart:
  stage: validate
  image: alpine/helm:3.15.4
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v/
  script:
    # Le chart depend du library-chart InseeFrLab : le recuperer avant tout rendu.
    - helm dependency update charts/grist-coder
    - helm lint charts/grist-coder --set ingress.hostname=ci.example.fr
    - helm template t charts/grist-coder --set ingress.hostname=ci.example.fr > /dev/null
    - echo "chart OK"

# ── 0bis. Validation serveur (compilation Python) ──────────────────────────────
check-server:
  stage: validate
  image: python:3.11-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v/
  script:
    - python -m py_compile grist_coder.py
    - |
      python <<'PY'
      import json, re, sys
      from pathlib import Path
      src = Path("grist_coder.py").read_text(encoding="utf-8")
      m = re.search(r"MCP Server v([\d.]+)", src)
      if not m:
          sys.exit("grist_coder.py : version introuvable dans la docstring")
      app = m.group(1)
      chart = Path("charts/grist-coder/Chart.yaml").read_text(encoding="utf-8")
      cm = re.search(r'^appVersion:\s*["\']?([\d.]+)', chart, re.M)
      if not cm or cm.group(1) != app:
          sys.exit(f"Chart appVersion != serveur ({app})")
      pkg = json.loads(Path("server.json").read_text(encoding="utf-8"))["packages"][0]["version"]
      if pkg != app:
          sys.exit(f"server.json OCI {pkg} != serveur {app}")
      print(f"versions alignees : {app}")
      PY
    - echo "grist_coder.py OK"

# -- 0ter. Validation vitrine ---------------------------------------------------
# GitHub ne fait que SERVIR docs/ (Pages, mode branche). Le garde-fou vit donc
# ici, ou vit la source : on rejoue les tests du generateur, on regenere, et on
# refuse un docs/ qui differerait — signe d'un HTML edite a la main ou d'un oubli
# de regeneration.
check-vitrine:
  stage: validate
  image: node:20-alpine
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v/
  before_script:
    - apk add --no-cache git
  script:
    - node --test site/generate.test.mjs
    - node site/generate.mjs
    - 'git diff --exit-code -- docs || (echo "docs/ n''est pas a jour : lancer ''node site/generate.mjs'' et commiter" && exit 1)'
    - echo "vitrine OK"

# ── 1. Build + push de l'image (kaniko : pas de privileged requis) ─────────────
# Le GitLab CEREMA n'a PAS de registre conteneur ($CI_REGISTRY_IMAGE vide) -> on
# pousse sur un registre externe public, configure par variables CI/CD (Settings ->
# CI/CD -> Variables) :
#   IMAGE_REGISTRY  hote du registre           (ex: ghcr.io)
#   IMAGE_REPO      chemin complet de l'image  (ex: ghcr.io/moncompte/grist-coder)
#   REGISTRY_USER   identifiant de push        (ex: user GitHub)
#   REGISTRY_TOKEN  token de push (MASKED)     (ex: PAT GitHub scope write:packages)
build-image:
  stage: build-image
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
    - if: $CI_COMMIT_TAG =~ /^v/
  script:
    - |
      if [ -z "$IMAGE_REPO" ] || [ -z "$REGISTRY_TOKEN" ]; then
        echo "ERREUR : definir IMAGE_REGISTRY / IMAGE_REPO / REGISTRY_USER / REGISTRY_TOKEN"
        echo "dans Settings -> CI/CD -> Variables (le GitLab CEREMA n'a pas de registre)."
        exit 1
      fi
    - |
      APP_VERSION=$(grep -m1 -oE 'MCP Server v[0-9]+(\.[0-9]+)*' grist_coder.py | sed 's/MCP Server v//')
      if [ -z "$APP_VERSION" ]; then
        echo "ERREUR : version applicative introuvable dans grist_coder.py"
        exit 1
      fi
      echo "Version applicative (tag OCI / server.json) : ${APP_VERSION}"
      DESTS="--destination ${IMAGE_REPO}:latest --destination ${IMAGE_REPO}:${APP_VERSION}"
      if [ -n "$CI_COMMIT_TAG" ]; then
        TAG_VER="${CI_COMMIT_TAG#v}"
        if [ "$TAG_VER" != "$APP_VERSION" ]; then
          DESTS="$DESTS --destination ${IMAGE_REPO}:${TAG_VER}"
        fi
      fi
    - mkdir -p /kaniko/.docker
    - |
      cat > /kaniko/.docker/config.json <<EOF
      {"auths":{"${IMAGE_REGISTRY}":{"username":"${REGISTRY_USER}","password":"${REGISTRY_TOKEN}"}}}
      EOF
    - /kaniko/executor
        --context "${CI_PROJECT_DIR}"
        --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
        $DESTS

# ── 2. Package + push du chart Helm vers le registre Helm GitLab ───────────────
publish-chart:
  stage: publish-chart
  image: alpine/helm:3.15.4
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
    - if: $CI_COMMIT_TAG =~ /^v/
  before_script:
    - apk add --no-cache curl
  script:
    # image.repository <- registre externe reellement pousse en etape 1 (IMAGE_REPO).
    - sed -i "s#^\(\s*repository:\).*#\1 ${IMAGE_REPO}#" charts/grist-coder/values.yaml
    - helm dependency update charts/grist-coder
    - helm package charts/grist-coder --destination .
    - CHART_TGZ=$(ls grist-coder-*.tgz | head -1)
    - echo "Publication ${CHART_TGZ} -> registre Helm GitLab (canal stable)"
    - |
      curl --fail --request POST \
        --user "gitlab-ci-token:${CI_JOB_TOKEN}" \
        --form "chart=@${CHART_TGZ}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/helm/api/stable/charts"
