<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><title>Grist Coder</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.6/ace.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.6/mode-html.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.6/mode-javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.6/mode-markdown.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.6/mode-json.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.6/theme-one_dark.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff;--bg2:#f8fafc;--bg3:#f1f5f9;
  --border:#e2e8f0;--text:#0f172a;--text2:#64748b;
  --accent:#3b82f6;--success:#10b981;--error:#ef4444;--warn:#f59e0b;
  --navy:#1e293b;
}
html,body{height:100%;overflow:hidden;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:13px}
body{display:flex;flex-direction:column}
#navbar{height:40px;background:#fff;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;padding:0 12px;flex-shrink:0}
#n-brand{display:flex;align-items:center;gap:5px;font-size:.82rem;font-weight:700;
  color:#3e5de7;padding-right:12px;border-right:1px solid var(--border);flex-shrink:0}
.n-brackets{display:flex;align-items:center;gap:3px}
#dot{width:7px;height:7px;border-radius:50%;background:var(--error);
  flex-shrink:0;transition:background .3s}
#dot.on{background:var(--success);cursor:pointer;box-shadow:0 0 0 2px rgba(16,185,129,.18)}
#dot.on:hover{box-shadow:0 0 0 3px rgba(16,185,129,.28)}
#navEditor{display:none;align-items:center;gap:6px}
#artSelect{padding:3px 7px;border-radius:6px;border:1px solid var(--border);
  background:var(--bg2);color:var(--text);font-size:.78rem;font-family:inherit;max-width:160px}
#artSelect:focus{outline:none;border-color:#3e5de7}
#saveStatus{font-size:.72rem;color:var(--text2)}
#panelToggle{display:flex;align-items:center;justify-content:center;
  width:30px;height:28px;border-radius:6px;border:1px solid var(--border);
  background:#3e5de7;color:#fff;cursor:pointer;transition:all .15s;flex-shrink:0}
#panelToggle:hover{background:#2845c1}
#panelToggle.off{background:#fff;color:var(--text2)}
#panelToggle.off:hover{background:var(--bg2);color:var(--text)}
#appBody{flex:1;display:flex;overflow:hidden;min-height:0}
#previewPane{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
#splitter{width:5px;background:var(--border);cursor:col-resize;flex-shrink:0;
  opacity:0;pointer-events:none;
  transition:opacity .22s cubic-bezier(.4,0,.2,1),background .12s}
#splitter.visible{opacity:1;pointer-events:auto}
#splitter:hover,#splitter.active{background:#3e5de7}
#editorPane{flex:0 0 auto;width:0;display:flex;flex-direction:column;overflow:hidden;
  border-left:1px solid var(--border);min-width:0;
  transition:width .22s cubic-bezier(.4,0,.2,1)}
#editorPane.open{min-width:160px}
#aceEditor{flex:1;min-height:0;overflow:hidden}
#renderFrame{flex:1;border:none;background:#fff;min-height:0}
#editorEmpty{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:10px;pointer-events:none;
  color:rgba(255,255,255,.25);font-size:.78rem;letter-spacing:.02em}
#editorPane{position:relative}
/* ACE scrollbars */
.ace_scrollbar::-webkit-scrollbar{width:6px;height:6px}
.ace_scrollbar::-webkit-scrollbar-track{background:transparent}
.ace_scrollbar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:3px}
.ace_scrollbar::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.26)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.toast{position:fixed;bottom:20px;right:20px;padding:10px 18px;border-radius:6px;color:#fff;
  font-size:12px;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.2);
  animation:ti .2s ease;pointer-events:none}
@keyframes ti{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<nav id="navbar">
  <div id="n-brand">
    <div class="n-brackets">
      <svg width="7" height="14" viewBox="0 0 12 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="8 6 2 12 8 18"/></svg>
      <div id="dot" onclick="copyToken()" title="Déconnecté"></div>
      <svg width="7" height="14" viewBox="12 0 12 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/></svg>
    </div>
    Coder
  </div>
  <span id="sbDoc" style="display:none"></span>
  <span id="sbArts" style="display:none"></span>
  <span id="sbTables" style="display:none"></span>
  <span id="sbCanvas" style="display:none"></span>
  <span id="tokenBadge" style="display:none"></span>
  <div style="flex:1"></div>
  <div id="navEditor">
    <select id="artSelect" onchange="onArtSelect()"><option value="">— aucun —</option></select>
    <span id="saveStatus"></span>
  </div>
  <button id="panelToggle" class="off" onclick="togglePanel()" title="Ouvrir panel code">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
</nav>
<div id="appBody">
  <div id="previewPane">
    <iframe id="renderFrame" sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups"></iframe>
  </div>
  <div id="splitter"></div>
  <div id="editorPane">
    <div id="aceEditor"></div>
    <div id="editorEmpty">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#3e5de7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity=".4"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
      <span>Sélectionne un artefact</span>
    </div>
  </div>
</div>
<script>
// ── GRIST BRIDGE SCRIPT (injecte dans les iframes srcdoc) ──────────────────
const GRIST_BRIDGE_SCRIPT =
  "(function(){" +
  "var _id=0,_p=new Map(),_cbs=new Map();" +
  "window.addEventListener('message',function(e){" +
    "var m=e.data;if(!m)return;" +
    "if(m.type==='grist-bridge-response'){var p=_p.get(m.callbackId);" +
      "if(p){_p.delete(m.callbackId);if(m.error)p.reject(new Error(m.error));else p.resolve(m.result);}}" +
    "if(m.type==='grist-bridge-callback'){var cb=_cbs.get(m.callbackId);if(cb)cb.apply(null,m.args||[]);}" +
  "});" +
  "function call(a,args){return new Promise(function(res,rej){" +
    "var id=++_id;_p.set(id,{resolve:res,reject:rej});" +
    "var t=window.parent===window?window:window.parent;" +
    "t.postMessage({type:'grist-bridge',action:a,args:args,callbackId:id},'*');" +
    "setTimeout(function(){if(_p.has(id)){_p.delete(id);rej(new Error('Bridge timeout'));}},30000);" +
  "})}" +
  "function reg(a,cb){var id=++_id;_cbs.set(id,cb);" +
    "var t=window.parent===window?window:window.parent;" +
    "t.postMessage({type:'grist-bridge',action:a,callbackId:id},'*');}" +
  "window.grist={" +
    "ready:function(){return Promise.resolve();}," +
    "docApi:{fetchTable:function(n){return call('fetchTable',[n]);}," +
      "applyUserActions:function(a){return call('applyUserActions',[a]);}," +
      "listTables:function(){return call('listTables',[]);}," +
      "getAccessToken:function(o){return call('getAccessToken',[o||{}]);}}," +
    "onRecords:function(cb){reg('onRecords',cb);}," +
    "onRecord:function(cb){reg('onRecord',cb);}," +
    "onNewRecord:function(cb){reg('onNewRecord',cb);}," +
    "setCursorPos:function(p){return call('setCursorPos',[p]);}," +
    "setSelectedRows:function(ids){return call('setSelectedRows',[ids]);}," +
    "fetchSelectedTable:function(o){return call('fetchSelectedTable',[o||{}]);}," +
    "fetchSelectedRecord:function(id,o){return call('fetchSelectedRecord',[id,o||{}]);}," +
    "setOption:function(k,v){return call('setOption',[k,v]);}," +
    "getOption:function(k){return call('getOption',[k]);}," +
    "setOptions:function(o){return call('setOptions',[o]);}," +
    "getOptions:function(){return call('getOptions',[]);}," +
    "clearOptions:function(){return call('clearOptions',[]);}," +
    "selectedTable:{" +
      "fetch:function(f){return call('selectedTable.fetch',[f||{}]);}," +
      "create:function(r){return call('selectedTable.create',[r]);}," +
      "update:function(r){return call('selectedTable.update',[r]);}," +
      "destroy:function(ids){return call('selectedTable.destroy',[ids]);}," +
      "upsert:function(r,o){return call('selectedTable.upsert',[r,o||{}]);}" +
    "}" +
  "};" +
  "var t=window.parent===window?window:window.parent;" +
  "t.postMessage({type:'grist-bridge-ready'},'*');" +
  "})();";

// ── APP RUNTIME SCRIPT (injecte dans les iframes) ──────────────────────────
const APP_RUNTIME_SCRIPT =
  "(function(){" +
  "var _s=Object.assign({},window.__APP_STATE__||{});var _ls={};" +
  "window.app={" +
    "navigate:function(p){window.parent.postMessage({type:'app-navigate',path:p},'*');}," +
    "emit:function(ev,d){window.parent.postMessage({type:'app-event',event:ev,data:d},'*');}," +
    "on:function(ev,cb){if(!_ls[ev])_ls[ev]=[];_ls[ev].push(cb);}," +
    "setState:function(p){Object.assign(_s,p);window.parent.postMessage({type:'app-setState',state:p},'*');}," +
    "get state(){return _s;}," +
    "notify:function(m,t){window.parent.postMessage({type:'app-notification',msg:m,notifType:t||'info'},'*');}" +
  "};" +
  "window.addEventListener('message',function(e){" +
    "var m=e.data;if(!m)return;" +
    "if(m.type==='app-event-relay'&&_ls[m.event])_ls[m.event].forEach(function(cb){cb(m.data);});" +
    "if(m.type==='app-state-update')Object.assign(_s,m.state);" +
  "});" +
  "if(window.__APP_ROUTE__)window.parent.postMessage({type:'app-init',route:window.__APP_ROUTE__},'*');" +
  "})();";

// ── prepareWidgetHTML ───────────────────────────────────────────────────────
function prepareWidgetHTML(html, ctx) {
  ctx = ctx || {};
  var bridgeTag = '<script>' + GRIST_BRIDGE_SCRIPT + '<' + '/script>';
  html = html.replace(/<script[^>]*grist-plugin-api\.js[^>]*><\/script>/gi, bridgeTag);
  var init = '<script>window.__APP_STATE__=' + JSON.stringify(ctx.state || {}) +
    ';window.__APP_ROUTE__="' + (ctx.route || '/') + '";' + APP_RUNTIME_SCRIPT + '<' + '/script>';
  return html.includes('</head>') ? html.replace('</head>', init + '</head>') : init + html;
}

// ── GristBridgeParent ───────────────────────────────────────────────────────
window.addEventListener('message', async function(e) {
  var m = e.data; if (!m) return;
  if (m.type === 'grist-bridge') {
    var action = m.action, args = m.args||[], cid = m.callbackId, src = e.source;
    try {
      var result = null;
      if (action === 'fetchTable')          result = await grist.docApi.fetchTable(args[0]);
      else if (action === 'applyUserActions') result = await grist.docApi.applyUserActions(args[0]);
      else if (action === 'listTables')     result = await grist.docApi.listTables();
      else if (action === 'getAccessToken') result = await grist.docApi.getAccessToken(args[0]||{});
      else if (action === 'setCursorPos')   grist.setCursorPos(args[0]);
      else if (action === 'setSelectedRows') grist.setSelectedRows(args[0]);
      else if (action === 'fetchSelectedTable')   result = await grist.fetchSelectedTable(args[0]||{});
      else if (action === 'fetchSelectedRecord')  result = await grist.fetchSelectedRecord(args[0], args[1]||{});
      else if (action === 'setOption')    result = await grist.setOption(args[0], args[1]);
      else if (action === 'getOption')    result = await grist.getOption(args[0]);
      else if (action === 'setOptions')   result = await grist.setOptions(args[0]);
      else if (action === 'getOptions')   result = await grist.getOptions();
      else if (action === 'clearOptions') result = await grist.clearOptions();
      else if (action === 'selectedTable.fetch')   result = await grist.selectedTable.fetch(args[0]||{});
      else if (action === 'selectedTable.create')  result = await grist.selectedTable.create(args[0]);
      else if (action === 'selectedTable.update')  result = await grist.selectedTable.update(args[0]);
      else if (action === 'selectedTable.destroy') result = await grist.selectedTable.destroy(args[0]);
      else if (action === 'selectedTable.upsert')  result = await grist.selectedTable.upsert(args[0], args[1]||{});
      else if (action === 'onRecords') {
        grist.onRecords(function(r,m){ src.postMessage({type:'grist-bridge-callback',callbackId:cid,args:[r,m]},'*'); });
      } else if (action === 'onRecord') {
        grist.onRecord(function(r,m){ src.postMessage({type:'grist-bridge-callback',callbackId:cid,args:[r,m]},'*'); });
      } else if (action === 'onNewRecord') {
        grist.onNewRecord(function(m){ src.postMessage({type:'grist-bridge-callback',callbackId:cid,args:[m]},'*'); });
      }
      src.postMessage({type:'grist-bridge-response',callbackId:cid,result:result},'*');
    } catch(err) {
      src.postMessage({type:'grist-bridge-response',callbackId:cid,error:err.message},'*');
    }
  }
  if (m.type === 'art-select' && m.nom) {
    var sel = document.getElementById('artSelect');
    if (sel) { sel.value = m.nom; onArtSelect(); }
    if (!_panelOpen) openPanel();
  }
  if (m.type === 'app-navigate') showToast('Navigate: ' + m.path, 'info');
  if (m.type === 'app-event') {
    var f = document.getElementById('renderFrame');
    if (f && f.contentWindow && f.contentWindow !== e.source)
      f.contentWindow.postMessage({type:'app-event-relay',event:m.event,data:m.data},'*');
  }
  if (m.type === 'app-setState') Object.assign(_sharedState, m.state);
  if (m.type === 'app-notification') showToast(m.msg, m.notifType||'info');
});

// ── STATE ───────────────────────────────────────────────────────────────────
const BASE = window.location.origin;
const _DISPLAY_ART = new URLSearchParams(window.location.search).get('a') || '';
const _DISPLAY_MODE = !!_DISPLAY_ART;
var _registered=false, _registering=false, _token=null, _mcpId=1, _es=null, _refreshTimer=null;
var _artefacts=[], _artefactsMap={}, _currentArt=null, _sharedState={};
var _editor, _panelOpen=false;

// ── ACE EDITOR ──────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', function() {
  if (_DISPLAY_MODE) {
    // Display mode: navbar masquée, render plein écran
    document.getElementById('navbar').style.display = 'none';
    return;
  }
  _editor = ace.edit('aceEditor');
  _editor.setTheme('ace/theme/one_dark');
  _editor.setOptions({fontSize:'13px',tabSize:2,useSoftTabs:true,wrap:false,showPrintMargin:false});
  _editor.on('change', debounce(autoPreview, 1800));
  _editor.on('change', debounce(autoSave, 3000));
  initSplitter();
});

function detectType(code) {
  var s = (code || '').trim();
  if (/^<svg[\s>]/i.test(s)) return 'svg';
  if (/^<!DOCTYPE html|^<html/i.test(s)) return 'html';
  if (/^(graph |flowchart |sequenceDiagram|classDiagram|gantt|pie |erDiagram|journey)/m.test(s)) return 'mermaid';
  if (/export default\s+\w+|React\.createElement/.test(s)) return 'react';
  if (/^[{\[]/.test(s) && s.indexOf('"routes"') !== -1) return 'app';
  if (/^#+ |^---\n/.test(s)) return 'markdown';
  if (/^(SELECT|INSERT|UPDATE|DELETE|CREATE|DROP)\b/im.test(s)) return 'sql';
  if (/^(import |from |def |class )/m.test(s) && s.indexOf('<') === -1) return 'python';
  return 'html';
}
function setEditorMode(type) {
  var modes = {html:'html',grist:'html',react:'html',
               markdown:'markdown',mermaid:'markdown',
               app:'json',python:'python',sql:'sql',svg:'xml'};
  _editor.session.setMode('ace/mode/' + (modes[type] || 'html'));
}

// ── GRIST INIT + REGISTER ───────────────────────────────────────────────────
grist.ready({ requiredAccess: 'full' });
grist.on('message', async function(msg) {
  window._gristMsg = msg;
  if (!_registered) await doRegister(msg);
});
// React to row selection from linked grid
grist.onRecord(function(record) {
  if (!record) return;
  if (_DISPLAY_MODE) {
    // Deployed artefact: relay record state to rendered iframe
    Object.assign(_sharedState, {record: record});
    if (_currentArt) renderArt(_currentArt);
  } else {
    // IDE mode: auto-select artefact if linked to Artefacts table (record has Nom field)
    if (record.Nom && _artefactsMap[record.Nom]) {
      var sel = document.getElementById('artSelect');
      if (sel && sel.value !== record.Nom) {
        sel.value = record.Nom;
        onArtSelect();
      }
    }
  }
});

// onOptions: support artefact name via Grist widgetOptions (set in customView JSON)
grist.onOptions(function(options) {
  if (!options) return;
  if (options.artefact && !_DISPLAY_MODE && !_currentArt) {
    // Triggered by widgetOptions.artefact — switch to display mode dynamically
    var nom = options.artefact;
    if (_artefactsMap[nom]) {
      _currentArt = _artefactsMap[nom];
      renderArt(_currentArt);
    } else if (_artefacts.length === 0) {
      // Artefacts not loaded yet — will be handled in loadArtefacts() via artSelect
      document.getElementById('artSelect').value = nom;
    }
  }
});

async function doRegister(msg) {
  if (_registering) return; _registering = true;
  try {
    var tk = await grist.docApi.getAccessToken({readOnly: false});
    var parts = (tk.baseUrl||'').split('/api/docs/');
    if (parts.length !== 2) { showToast('baseUrl invalide','error'); return; }
    var siteUrl = parts[0], docId = parts[1].split('/')[0];
    var docTitle = (msg && msg.docTitle) || document.title || docId;
    var userId = (msg && msg.userId) || null;
    if (!userId) {
      try {
        var b64 = tk.token.split('.')[1];
        if (b64) {
          var pl = JSON.parse(atob(b64.replace(/-/g,'+').replace(/_/g,'/')));
          var raw = pl.userId != null ? pl.userId : (pl.sub != null ? pl.sub : null);
          userId = raw !== null ? Number(raw)||null : null;
        }
      } catch(_) {}
    }
    var res = await fetch(BASE+'/register', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({accessToken:tk.token,docId,docTitle,siteUrl,userId})});
    var data = await res.json();
    if (data.error) { showToast('Erreur: '+data.error,'error'); return; }
    _registered = true; _token = data.token;
    var dot = document.getElementById('dot');
    dot.className = 'on'; dot.title = 'Connecté · cliquer pour copier token MCP';
    document.getElementById('sbDoc').textContent = docTitle;
    listenSSE();
    await loadArtefacts();
    if (_refreshTimer) clearTimeout(_refreshTimer);
    var delay = Math.max((tk.ttlMsecs||3600000)*0.8, 60000);
    _refreshTimer = setTimeout(async function() {
      _registered = false;
      if (window._gristMsg) await doRegister(window._gristMsg);
    }, delay);
  } catch(e) { showToast('Connexion: '+e.message,'error'); }
  finally { _registering = false; }
}

// ── SSE ─────────────────────────────────────────────────────────────────────
function listenSSE() {
  if (!_token) return;
  if (_es) { _es.close(); _es = null; }
  _es = new EventSource(BASE+'/mcp?token='+encodeURIComponent(_token));
  _es.onmessage = function(e) {
    try {
      var ev = JSON.parse(e.data);
      if (ev.token === _token) {
        if (ev.type === 'canvas_updated' || ev.type === 'canvas_patched') {
          loadCanvasIntoEditor().then(renderCurrent);
          document.getElementById('sbCanvas').textContent = ev.sha || 'updated';
        }
        if (ev.type === 'type_changed' && _currentArt) {
          _currentArt.Type = ev.artType;
          _artefactsMap[_currentArt.Nom].Type = ev.artType;
          setEditorMode(ev.artType);
          renderArt(_currentArt);
          renderArtSelect(); // refresh icons in dropdown
        }
        if (ev.type === 'screenshot_request') captureScreenshot();
      }
    } catch(_) {}
  };
  _es.onerror = function() {
    if (_es) { _es.close(); _es = null; }
    _registered = false;
    setTimeout(async function() { if (window._gristMsg) await doRegister(window._gristMsg); }, 3000);
  };
}

// ── MCP TOOL CALL ────────────────────────────────────────────────────────────
async function tool(name, args) {
  if (!_token) throw new Error('Widget non connecte');
  var r = await fetch(BASE+'/mcp', {method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+_token},
    body: JSON.stringify({jsonrpc:'2.0',id:_mcpId++,method:'tools/call',
                          params:{name:name,arguments:args||{}}})});
  var d = await r.json();
  if (d.error) throw new Error(d.error.message);
  return JSON.parse(d.result.content[0].text);
}

async function loadCanvasIntoEditor() {
  if (!_editor) return;
  try {
    var code = await tool('canvas_read');
    if (_editor && typeof code === 'string' && code !== _editor.getValue()) {
      var pos = _editor.getCursorPosition();
      _editor.setValue(code, -1);
      _editor.moveCursorToPosition(pos);
    }
  } catch(e) { console.warn('canvas_read:', e.message); }
}

// ── ARTEFACTS ────────────────────────────────────────────────────────────────
async function initArtefactsTable() {
  showToast('Initialisation table Artefacts…', 'info');
  await grist.docApi.applyUserActions([['AddTable', 'Artefacts', [
    {id:'Nom',          type:'Text'},
    {id:'Type',         type:'Choice', widgetOptions:JSON.stringify({choices:['html','react','grist','app','markdown','mermaid','python','sql','svg']})},
    {id:'Code',         type:'Text'},
    {id:'Description',  type:'Text'},
    {id:'Dependencies', type:'Text'},
    {id:'IsDoc',        type:'Bool'},
    {id:'Output',       type:'Text'},
    {id:'UpdatedAt',    type:'DateTime:Europe/Paris'},
  ]]]);
  showToast('Table Artefacts créée ✓', 'success');
}

async function loadArtefacts() {
  var data;
  try {
    data = await grist.docApi.fetchTable('Artefacts');
  } catch(e) {
    try {
      await initArtefactsTable();
      data = await grist.docApi.fetchTable('Artefacts');
    } catch(e2) {
      document.getElementById('sbArts').textContent = '0 artefacts';
      return;
    }
  }
  var n = (data.id||[]).length;
  _artefacts = []; _artefactsMap = {};
  for (var i=0; i<n; i++) {
    var art = {
      id: data.id[i], Nom: (data.Nom||[])[i]||'', Type: (data.Type||[])[i]||'html',
      Code: (data.Code||[])[i]||'',
      Description: (data.Description||[])[i]||'', IsDoc: !!(data.IsDoc||[])[i],
    };
    _artefacts.push(art);
    if (art.Nom) _artefactsMap[art.Nom] = art;
  }
  renderArtSelect();
  document.getElementById('sbArts').textContent = _artefacts.length + ' artefacts';
  try {
    var s = await tool('grist_schema');
    document.getElementById('sbTables').textContent = (s.tables||[]).length + ' tables';
  } catch(_) {}
  var autoNom = _DISPLAY_MODE ? _DISPLAY_ART : (_artefacts.length > 0 ? _artefacts[0].Nom : '');
  if (autoNom && !_currentArt) {
    document.getElementById('artSelect').value = autoNom;
    await onArtSelect();
  } else if (!_currentArt) {
    renderEmpty();
  }
}

var TYPE_ICONS = {html:'🌐',react:'⚛',grist:'🧮',app:'📦',markdown:'📄',mermaid:'🔀',python:'🐍',sql:'⚡',svg:'📐'};
function typeIcon(t){ return TYPE_ICONS[t]||'📄'; }

function renderArtSelect() {
  var sel = document.getElementById('artSelect');
  var cur = sel.value;
  sel.innerHTML = '<option value="">— aucun —</option>' +
    _artefacts.map(function(a) {
      return '<option value="'+a.Nom+'">'+typeIcon(a.Type)+' '+a.Nom+'</option>';
    }).join('');
  if (cur) sel.value = cur;
}

async function onArtSelect() {
  var nom = document.getElementById('artSelect').value;
  if (!nom) { _currentArt = null; setEditorHeader(null); renderEmpty(); return; }
  var art = _artefactsMap[nom];
  if (!art) return;
  _currentArt = art;
  if (!art.Type && art.Code) art.Type = detectType(art.Code);
  if (_editor) {
    _editor.setValue(art.Code || '', -1);
    setEditorMode(art.Type);
    setEditorHeader(art);
    try { await tool('canvas_write', {code: art.Code || '', art_id: art.id, art_nom: art.Nom, art_type: art.Type}); } catch(_) {}
  }
  renderArt(art);
}

function setEditorHeader(art) { /* artSelect IS the header */ }

// ── RENDER ───────────────────────────────────────────────────────────────────

    '<style>*{box-sizing:border-box;margin:0;padding:0}' +

    '.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:32px}' +

    '.hero-label{font-size:.95rem;font-weight:700;color:#3e5de7;letter-spacing:.01em}' +
    '.hint{font-size:.82rem;color:#64748b;text-align:center;max-width:280px;line-height:1.6}' +
    '.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:420px}' +
    '</style></head><body>' +
    '<div class="wrap">' +
    '<div class="hero">' +
    '<div class="hero-icon">' +
    '<svg width="9" height="18" viewBox="0 0 12 24" fill="none" stroke="#3e5de7" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="8 6 2 12 8 18"/></svg>' +
    '<div class="brand-dot"></div>' +
    '<svg width="9" height="18" viewBox="12 0 12 24" fill="none" stroke="#3e5de7" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/></svg>' +
    '</div>' +
    '<div class="hero-label">Coder</div>' +
    '</div>' +
    (n > 0
      ? '<div class="hint">'+n+' artefact'+(n>1?'s':'')+' disponible'+(n>1?'s':'')+' · sélectionne pour voir le rendu</div>' +

      : '<div class="hint">Aucun artefact<br>demande à Claude d\'en créer un</div>'
    ) +

    '</body></html>';
  frame.srcdoc = body;
  // hide editor empty overlay when no art selected
  var ee = document.getElementById('editorEmpty');
  if (ee) ee.style.display = 'flex';
}

function renderArt(art) {
  if (!art) { renderEmpty(); return; }
  var ee = document.getElementById('editorEmpty');
  if (ee) ee.style.display = 'none';
  var type = art.Type || 'html', code = art.Code || '';
  var frame = document.getElementById('renderFrame');
  // Bridge Grist disponible pour tous les types iframe (interaction tables/données)
  var ctx = {state: _sharedState, route: '/'};
  if (['html','grist','react'].includes(type)) {
    frame.srcdoc = prepareWidgetHTML(code, ctx);
  } else if (type === 'markdown') {
    var mdHtml = '<!DOCTYPE html><html><head><meta charset="UTF-8">' +
      '<style>' +
      'body{font-family:Inter,-apple-system,sans-serif;padding:28px 32px;max-width:72ch;margin:0 auto;' +
        'line-height:1.75;color:#1e293b;font-size:15px}' +
      'h1,h2,h3,h4{font-weight:700;margin:1.6em 0 .5em;line-height:1.3}' +
      'h1{font-size:1.7em;border-bottom:2px solid #e2e8f0;padding-bottom:.4em}' +
      'h2{font-size:1.3em}h3{font-size:1.1em}' +
      'a{color:#3e5de7;text-decoration:none}a:hover{text-decoration:underline}' +
      'code{font-family:monospace;font-size:.88em;background:#f1f5f9;padding:1px 6px;border-radius:4px;color:#be185d}' +
      'pre{background:#1e293b;color:#e2e8f0;padding:16px 20px;border-radius:8px;overflow-x:auto;font-size:.85em;line-height:1.5}' +
      'pre code{background:none;padding:0;color:inherit;font-size:inherit}' +
      'blockquote{margin:0;padding:0 1em;border-left:3px solid #3e5de7;color:#64748b}' +
      'table{border-collapse:collapse;width:100%;margin:1em 0}th,td{border:1px solid #e2e8f0;padding:8px 12px}' +
      'th{background:#f8fafc;font-weight:600}tr:nth-child(even){background:#f8fafc}' +
      'input[type=checkbox]{margin-right:6px}' +
      'hr{border:none;border-top:1px solid #e2e8f0;margin:2em 0}' +
      '</style></head><body><div id="c"></div>' +
      '<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"><' + '/script>' +
      '<script src="https://cdn.jsdelivr.net/npm/highlight.js@11/highlight.min.js"><' + '/script>' +
      '<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github-dark.min.css">' +
      '<script>marked.setOptions({gfm:true,breaks:false,highlight:function(c,l){' +
        'return hljs.highlightAuto(c,[l]).value;}});' +
        'document.getElementById("c").innerHTML=marked.parse(' + JSON.stringify(code) + ');<' + '/script>' +
      '</body></html>';
    frame.srcdoc = prepareWidgetHTML(mdHtml, ctx);
  } else if (type === 'mermaid') {
    var mmdHtml = '<!DOCTYPE html><html><head><meta charset="UTF-8">' +
      '<style>body{margin:0;background:#f8fafc;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}' +
      '.mermaid{background:#fff;border-radius:10px;padding:24px;box-shadow:0 1px 4px rgba(0,0,0,.08)}</style></head><body>' +
      '<div class="mermaid">' + code.replace(/</g,'&lt;') + '</div>' +
      '<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"><' + '/script>' +
      '<script>mermaid.initialize({startOnLoad:true,theme:"neutral"});<' + '/script>' +
      '</body></html>';
    frame.srcdoc = prepareWidgetHTML(mmdHtml, ctx);
  } else if (type === 'svg') {
    var svgHtml = '<!DOCTYPE html><html><body style="margin:0;background:#f8fafc;display:flex;align-items:center;justify-content:center;min-height:100vh">' + code + '</body></html>';
    frame.srcdoc = prepareWidgetHTML(svgHtml, ctx);
  } else {
    // python, sql, app → raw code, pas d'interaction iframe
    var escaped = code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    frame.srcdoc = '<!DOCTYPE html><html><head><meta charset="UTF-8">' +
      '<style>body{margin:0;background:#1e293b;color:#e2e8f0;font-family:monospace;font-size:12px}pre{padding:16px;white-space:pre-wrap;line-height:1.6}</style>' +
      '</head><body><pre>' + escaped + '</pre></body></html>';
  }
}

function renderCurrent() {
  var code = _editor ? _editor.getValue() : '';
  renderArt(Object.assign({}, _currentArt || {Type:'html',Nom:'Canvas'}, {Code:code}));
}
function autoPreview() { renderCurrent(); }

// ── SAVE ─────────────────────────────────────────────────────────────────────
async function saveArt() {
  if (!_currentArt) return;
  var code = _editor ? _editor.getValue() : '';
  if (code === _currentArt.Code) return;
  var ss = document.getElementById('saveStatus');
  if (ss) ss.textContent = 'saving…';
  try {
    // Sauvegarde directe browser→Grist via applyUserActions (contourne WAF serveur)
    await grist.docApi.applyUserActions([
      ['UpdateRecord', 'Artefacts', _currentArt.id, {Code: code, UpdatedAt: Math.floor(Date.now()/1000)}]
    ]);
    _currentArt.Code = code;
    _artefactsMap[_currentArt.Nom].Code = code;
    if (ss) ss.textContent = 'saved ✓';
    setTimeout(function(){ if (ss) ss.textContent = ''; }, 2000);
  } catch(e) { if (ss) ss.textContent = 'err'; console.error('saveArt:', e); }
}
function autoSave() { saveArt(); }

// ── SCREENSHOT ───────────────────────────────────────────────────────────────
async function captureScreenshot() {
  var frame = document.getElementById('renderFrame');
  try {
    var fdoc = frame.contentDocument || (frame.contentWindow && frame.contentWindow.document);
    if (!fdoc || !fdoc.body) return;
    if (!frame.contentWindow.html2canvas) {
      await new Promise(function(res, rej) {
        var s = fdoc.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
        s.onload = res; s.onerror = rej;
        fdoc.head.appendChild(s);
      });
    }
    await new Promise(function(r){ setTimeout(r, 600); });
    var msgId = 'sc-' + Date.now();
    var image = await new Promise(function(res) {
      var timer = setTimeout(function(){ window.removeEventListener('message',h); res(''); }, 10000);
      function h(e) {
        if (e.data && e.data.type === 'screenshot-result' && e.data.id === msgId) {
          clearTimeout(timer); window.removeEventListener('message', h); res(e.data.image);
        }
      }
      window.addEventListener('message', h);
      var s = fdoc.createElement('script');
      s.textContent = '(function(){html2canvas(document.body,{useCORS:true,allowTaint:true,logging:false})' +
        '.then(function(c){parent.postMessage({type:"screenshot-result",id:"' + msgId + '",image:c.toDataURL("image/png")},"*")})' +
        '.catch(function(){parent.postMessage({type:"screenshot-result",id:"' + msgId + '",image:""},"*")});})();';
      fdoc.body.appendChild(s);
    });
    if (!image) return;
    await fetch(BASE+'/screenshot', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({token:_token, image:image})});
  } catch(e) { console.warn('screenshot:', e.message); }
}

// ── LAYOUT ───────────────────────────────────────────────────────────────────
var SVG_CLOSE = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>';
var SVG_OPEN  = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>';

function openPanel() {
  _panelOpen = true;
  var ep = document.getElementById('editorPane');
  var sp = document.getElementById('splitter');
  var pt = document.getElementById('panelToggle');
  var ne = document.getElementById('navEditor');
  var w = ep._savedWidth || Math.round(document.getElementById('appBody').offsetWidth * 0.4);
  ep.classList.add('open');
  ep.style.width = w + 'px';
  sp.classList.add('visible');
  pt.innerHTML = SVG_OPEN; pt.classList.remove('off'); pt.title = 'Rendu plein';
  ne.style.display = 'flex';
  // resize after CSS transition completes (~220ms)
  setTimeout(function(){ if (_editor) _editor.resize(); }, 240);
}
function closePanel() {
  _panelOpen = false;
  var ep = document.getElementById('editorPane');
  ep.classList.remove('open');
  ep.style.width = '0';
  document.getElementById('splitter').classList.remove('visible');
  var pt = document.getElementById('panelToggle');
  pt.innerHTML = SVG_CLOSE; pt.classList.add('off'); pt.title = 'Ouvrir panel code';
  document.getElementById('navEditor').style.display = 'none';
  setTimeout(function(){ if (_editor) _editor.resize(); }, 240);
}
function togglePanel() {
  if (_panelOpen) closePanel(); else openPanel();
}

function initSplitter() {
  var sp = document.getElementById('splitter');
  sp.addEventListener('pointerdown', function(e) {
    e.preventDefault();
    var ep = document.getElementById('editorPane');
    var startX = e.clientX, startW = ep.offsetWidth;
    ep.style.transition = 'none'; // disable during drag for instant response
    sp.classList.add('active');
    sp.setPointerCapture(e.pointerId);
    function onMove(e) {
      var total = document.getElementById('appBody').offsetWidth;
      var newW = Math.max(160, Math.min(startW - (e.clientX - startX), total - 160));
      ep.style.width = newW + 'px';
      ep._savedWidth = newW;
      if (_editor) _editor.resize();
    }
    function onUp() {
      ep.style.transition = ''; // re-enable transition
      sp.classList.remove('active');
      sp.removeEventListener('pointermove', onMove);
      sp.removeEventListener('pointerup', onUp);
    }
    sp.addEventListener('pointermove', onMove);
    sp.addEventListener('pointerup', onUp);
  });
}

// ── UTILS ────────────────────────────────────────────────────────────────────
function copyToken() {
  if (!_token) return;
  navigator.clipboard.writeText(_token);
  showToast('Token copié','success');
}

function showToast(msg, type) {
  var colors={info:'#3b82f6',success:'#10b981',error:'#ef4444',warn:'#f59e0b',warning:'#f59e0b'};
  var t = document.createElement('div');
  t.className = 'toast';
  t.style.background = colors[type] || colors.info;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){t.remove();}, 3000);
}

function debounce(fn, delay) {
  var timer;
  return function() { clearTimeout(timer); timer = setTimeout(fn, delay); };
}
