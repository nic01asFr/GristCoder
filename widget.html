// ── SAVE ─────────────────────────────────────────────────────────────────────
async function saveArt() {
  if (!_currentArt) return;
  // Block writes during server-driven updates: editor and _currentArt may be
  // momentarily out of sync (e.g. canvas_patched switched _currentArt but
  // loadCanvasIntoEditor hasn't completed yet).
  if (_serverUpdating) {
    console.warn('saveArt: blocked — server update in progress');
    return;
  }
  // Capture the artefact reference BEFORE awaiting anything: _currentArt may
  // be reassigned while applyUserActions is in flight, which would otherwise
  // cause us to write the saved code to the wrong artefact in _artefactsMap.
  var art = _currentArt;
  var code = _editor ? _editor.getValue() : '';
  if (code === art.Code) return;
  // Safety: never overwrite a non-empty artefact with an empty editor.
  if (!code && art.Code) {
    console.warn('saveArt: refusing to overwrite non-empty artefact with empty editor');
    return;
  }
  _setSyncStatus('saving');
  try {
    // Sauvegarde directe browser→Grist via applyUserActions (contourne WAF serveur)
    await grist.docApi.applyUserActions([
      ['UpdateRecord', 'Artefacts', art.id, {Code: code, UpdatedAt: Math.floor(Date.now()/1000)}]
    ]);
    art.Code = code;
    if (_artefactsMap[art.Nom]) _artefactsMap[art.Nom].Code = code;
    _setSyncStatus('saved');
  } catch(e) { _setSyncStatus('error'); console.error('saveArt:', e); }
}
function scheduleAutoSave() {
  cancelAutoSave();
  _autoSaveTimer = setTimeout(function() {
    _autoSaveTimer = null;
    if (_serverUpdating) return;
    autoSave();
  }, 3000);
}
function cancelAutoSave() {
  if (_autoSaveTimer) { clearTimeout(_autoSaveTimer); _autoSaveTimer = null; }
}
function autoSave() {
  // Skip if content was just set from server (not a user edit)
  var cur = _editor ? _editor.getValue() : '';
  if (_lastServerCanvas !== null && cur === _lastServerCanvas) return;
  saveArt();
}

// ── SCREENSHOT ───────────────────────────────────────────────────────────────
async function captureScreenshot() {
  try {
    var frame = document.getElementById('renderFrame');
    if (!frame || !frame.contentWindow) return;
    // Wait for iframe to be fully loaded before requesting screenshot
    await new Promise(function(resolve) {
      try {
        if (frame.contentDocument && frame.contentDocument.readyState === 'complete') { resolve(); return; }
      } catch(_) {} // cross-origin: can't check readyState, use fallback
      var _loadDone = false;
      frame.addEventListener('load', function _onLoad() { if (!_loadDone) { _loadDone = true; resolve(); } frame.removeEventListener('load', _onLoad); });
      setTimeout(function() { if (!_loadDone) { _loadDone = true; resolve(); } }, 500); // fallback
    });
    // L'iframe se capture elle-même (html2canvas dans l'iframe = accès DOM complet)
    var dataUrl = await new Promise(function(resolve, reject) {
      var timer = setTimeout(function() { reject(new Error('timeout 12s')); }, 12000);
      function handler(e) {
        if (e.data && e.data.type === 'screenshot-data') {
          window.removeEventListener('message', handler);
          clearTimeout(timer);
          if (e.data.dataUrl) resolve(e.data.dataUrl);
          else reject(new Error(e.data.error || 'capture failed'));
        }
      }
      window.addEventListener('message', handler);
      frame.contentWindow.postMessage({type: 'take-screenshot'}, '*');
    });
    if (!dataUrl) return;
    await fetch(BASE+'/screenshot', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({token:_token, image:dataUrl})});
  } catch(e) { console.warn('screenshot:', e.message); }
}

// ── LAYOUT ───────────────────────────────────────────────────────────────────
var SVG_CLOSE = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>';
var SVG_OPEN  = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>';

function openPanel() {
  _panelOpen = true;
  var ep = document.getElementById('editorPane');
  var sp = document.getElementById('splitter');
  var pt = document.getElementById('panelToggle');
  var w = ep._savedWidth || Math.round(document.getElementById('appBody').offsetWidth * 0.4);
  ep.classList.add('open');
  ep.style.width = w + 'px';
  sp.classList.add('visible');
  pt.innerHTML = SVG_OPEN; pt.classList.remove('off'); pt.title = 'Rendu plein';
  // resize after CSS transition completes (~220ms)
  setTimeout(function(){ if (_editor) _editor.resize(); }, 240);
}
function closePanel() {
  _panelOpen = false;
  var ep = document.getElementById('editorPane');
  ep.classList.remove('open');
  ep.style.width = '0';
  document.getElementById('splitter').classList.remove('visible');
  var pt = document.getElementById('panelToggle');
  pt.innerHTML = SVG_CLOSE; pt.classList.add('off'); pt.title = 'Ouvrir panel code';
  setTimeout(function(){ if (_editor) _editor.resize(); }, 240);
}
function togglePanel() {
  if (_panelOpen) closePanel(); else openPanel();
}

function initSplitter() {
  var sp = document.getElementById('splitter');
  sp.addEventListener('pointerdown', function(e) {
    e.preventDefault();
    var ep = document.getElementById('editorPane');
    var startX = e.clientX, startW = ep.offsetWidth;
    ep.style.transition = 'none'; // disable during drag for instant response
    sp.classList.add('active');
    sp.setPointerCapture(e.pointerId);
    function onMove(e) {
      var total = document.getElementById('appBody').offsetWidth;
      var newW = Math.max(160, Math.min(startW - (e.clientX - startX), total - 160));
      ep.style.width = newW + 'px';
      ep._savedWidth = newW;
      if (_editor) _editor.resize();
    }
    function onUp() {
      ep.style.transition = ''; // re-enable transition
      sp.classList.remove('active');
      sp.removeEventListener('pointermove', onMove);
      sp.removeEventListener('pointerup', onUp);
    }
    sp.addEventListener('pointermove', onMove);
    sp.addEventListener('pointerup', onUp);
  });
}

// ── UTILS ────────────────────────────────────────────────────────────────────
function copyToken() {
  if (!_token) return;
  navigator.clipboard.writeText(_token);
  showToast('Token copié','success');
}

function showToast(msg, type) {
  var colors={info:'#3b82f6',success:'#10b981',error:'#ef4444',warn:'#f59e0b',warning:'#f59e0b'};
  var t = document.createElement('div');
  t.className = 'toast';
  t.style.background = colors[type] || colors.info;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){t.remove();}, 3000);
}

function debounce(fn, delay) {
  var timer;
  return function() { clearTimeout(timer); timer = setTimeout(fn, delay); };
}

// ── WIZARD 3-ZONE ARCHITECTURE ───────────────────────────────────────────────
// Zone 1: #planBanner — persistent plan progress (compact bar)
// Zone 2: #wizardBackdrop + #wizardModal — centered modal for blocking cards
// Zone 3: #statusPanel + #chatSection — bottom panel for non-blocking cards + chat
var _wzCards = {};       // id → {step, token}
var _wzOrder = [];       // card display order
var _wzDiState = {};     // data-import state: cid → {step, data:[], selected:Set}

// ── ZONE 1 — Plan Banner ────────────────────────────────────────────────────
// % de secours par phase quand step.progress est absent (evite la barre a 0%)
var _PHASE_PCT = {qualifying:10,assessing:20,designing:35,building:65,verifying:85,done:100};

function updatePlanBanner(step) {
  var banner = document.getElementById('planBanner');
  if (!step || (!step.title && !step.progress && !(step.sections||[]).length)) {
    banner.style.display = 'none'; return;
  }
  banner.style.display = 'block';
  var secs = step.sections || [];
  // Phase explicite du step (pilotee par le harness/contexte) prioritaire sur _currentContext.
  var ctx = step.phase || _currentContext || 'qualifying';
  if (step.phase) _currentContext = step.phase;  // garde la puce et le reste en phase
  // Progress bar : valeur du step, sinon derivee de la phase courante
  var pct = (typeof step.progress === 'number' && step.progress > 0)
    ? step.progress : (_PHASE_PCT[ctx] || 0);
  document.getElementById('pbFill').style.width = pct + '%';
  // Phase chip
  var chip = document.getElementById('pbChip');
  var phaseLabels = {qualifying:'Qualif.',assessing:'Explore',designing:'Design',
    building:'Build',verifying:'Vérif.',done:'Livré'};
  chip.textContent = phaseLabels[ctx] || ctx;
  // Stats (from code sections, sinon %)
  var parts = [];
  secs.forEach(function(s) { if (s.style === 'code') parts.push(s.content); });
  document.getElementById('pbStats').textContent = parts.join(' · ') || (pct + '%');
  // Detail sections + toggle masque si rien a deplier
  var detail = document.getElementById('pbSections');
  detail.innerHTML = secs.map(function(s) {
    return '<div class="pb-section '+(s.style||'default')+'"><span class="pb-label">'
      + _wzEsc(s.label||'') + '</span> <span class="pb-content">'
      + _wzEsc(s.content||'') + '</span></div>';
  }).join('');
  var toggle = document.querySelector('.pb-toggle');
  if (toggle) toggle.style.visibility = secs.length ? 'visible' : 'hidden';
}

function togglePlanDetail() {
  var detail = document.getElementById('pbDetail');
  var main = document.querySelector('.pb-main');
  if (detail.style.display === 'none') {
    detail.style.display = 'block'; main.classList.add('expanded');
  } else {
    detail.style.display = 'none'; main.classList.remove('expanded');
  }
}

// ── ZONE 2 & 3 — Card routing ───────────────────────────────────────────────
function _ctxToCard(panel, token) {
  if (!panel || (!panel.title && !(panel.sections||[]).length)) {
    // Clear plan banner
    document.getElementById('planBanner').style.display = 'none'; return;
  }
  // Plan updates → Zone 1 (banner), not a card
  var step = {id:'ctx-plan-progress', type:'plan', title:panel.title,
    sections:panel.sections, progress:panel.progress,
    actions:panel.actions, input:panel.input};
  // If plan has blocking actions/input, show as modal
  if ((panel.actions||[]).length > 0 || !!panel.input) {
    showWizardCard(step, token);
  } else {
    updatePlanBanner(step);
  }
}

function showWizardCard(step, token) {
  if (!step || !step.id) return;
  var id = step.id;
  _wzCards[id] = {step:step, token:token||_token};
  if (_wzOrder.indexOf(id) < 0) _wzOrder.push(id);

  // Seule la card plan dediee va au bandeau (Zone 1). Les cards progress nommees
  // (ex: build-progress) tombent en Zone 3 et sont rendues avec leurs steps.
  if (id === 'ctx-plan-progress' && !_wzIsBlocking(step)) {
    updatePlanBanner(step);
    return;
  }

  if (_wzIsBlocking(step)) {
    // Blocking card → Zone 2 modal. Masquer le panneau bas tant que le modal
    // est ouvert (evite tout recouvrement du bouton submit).
    var backdrop = document.getElementById('wizardBackdrop');
    var modal = document.getElementById('wizardModal');
    modal.innerHTML = _wzBuildCard(id, step);
    // Activate mermaid iframes if present
    modal.querySelectorAll('iframe[data-srcdoc-b64]').forEach(function(fr) {
      try { fr.srcdoc = decodeURIComponent(escape(atob(fr.getAttribute('data-srcdoc-b64')))); } catch(e) {}
    });
    backdrop.style.display = 'flex';
    document.getElementById('statusPanel').style.display = 'none';
    _updateChatVisibility();
  } else {
    // Non-blocking card → Zone 3 status panel
    _rebuildStatusCards();
    document.getElementById('statusPanel').style.display = 'block';
    _updateChatVisibility();
  }
}

function _rebuildStatusCards() {
  var container = document.getElementById('statusCards');
  if (!container) return;
  var html = '';
  _wzOrder.forEach(function(id) {
    var c = _wzCards[id]; if (!c) return;
    // Skip cards routed to Zone 1 (plan banner) or Zone 2 (modal)
    if (_wzIsBlocking(c.step)) return;
    if (id === 'ctx-plan-progress') return;
    html += _wzBuildCard(id, c.step);
  });
  container.innerHTML = html;
  // Show/hide status panel
  document.getElementById('statusPanel').style.display = html ? 'block' : 'none';
}

function closeWizardCard(id) {
  // Animate exit in whichever zone
  var el = document.querySelector('.wz-card[data-wid="'+_wzEsc(id)+'"]');
  if (el) {
    el.classList.add('card-exit');
    setTimeout(function() { _wzRemove(id); }, 200);
  } else { _wzRemove(id); }
}

function _wzRemove(id) {
  _wzOrder = _wzOrder.filter(function(x){return x!==id;});
  delete _wzCards[id];
  // Close backdrop if no blocking cards remain
  var hasBlocking = _wzOrder.some(function(xid) {
    var c = _wzCards[xid]; return c && _wzIsBlocking(c.step);
  });
  if (!hasBlocking) {
    document.getElementById('wizardBackdrop').style.display = 'none';
    document.getElementById('wizardModal').innerHTML = '';
  }
  // _rebuildStatusCards restaure aussi le panneau bas masque pendant un modal bloquant
  _rebuildStatusCards();
  _updateChatVisibility();
  // If nothing left, hide all
  if (_wzOrder.length === 0) {
    document.getElementById('statusPanel').style.display = 'none';
  }
}

function closeWizard() {
  _wzCards = {}; _wzOrder = [];
  document.getElementById('wizardBackdrop').style.display = 'none';
  document.getElementById('wizardModal').innerHTML = '';
  document.getElementById('statusPanel').style.display = 'none';
  document.getElementById('planBanner').style.display = 'none';
}

function _updateChatVisibility() {
  var cs = document.getElementById('chatSection');
  // Show chat if any wizard cards are active or chat has history
  var hasMsgs = document.getElementById('chatMsgs').children.length > 0;
  cs.classList.toggle('active', _wzOrder.length > 0 || hasMsgs);
}

function _wzHasChatHistory() {
  var msgs = document.getElementById('chatMsgs');
  return msgs && msgs.children.length > 0;
}

function _wzBuildCard(id, step) {
  var blocking = _wzIsBlocking(step);
  var isPlan   = (step.type === 'plan');
  var cls = 'wz-card'+(blocking?' card-blocking':'')+(isPlan?' card-plan':'');
  var esc = _wzEsc(id);
  var hd  = '<div class="wz-hd"><div class="wz-hd-l">'
    + '<div class="wz-title">'+_wzEsc(step.title||'')+'</div>'
    + (step.subtitle?'<div class="wz-subtitle">'+_wzEsc(step.subtitle)+'</div>':'')
    + '</div>'
    + (!blocking?'<button class="wz-hd-x" onclick="closeWizardCard(\''+esc+'\')" title="Fermer">✕</button>':'')
    + '</div>';
  return '<div class="'+cls+'" data-wid="'+esc+'">'
    + hd
    + '<div class="wz-body"><div class="wz-inner">'+_wzRenderBody(step,id)+'</div></div>'
    + '</div>';
}

function _wzIsBlocking(step) {
  if (!step) return false;
  var t = step.type;
  return t==='choice'||t==='form'||t==='confirm'||t==='input'||t==='preview'||t==='data-import'
    ||(t==='plan'&&((step.actions||[]).length>0||!!step.input))
    ||(t==='info'&&(step.actions||[]).length>0)
    ||(t==='progress'&&((step.actions||[]).length>0||!!step.input));
}

// ── WIZARD ────────────────────────────────────────────────────────────────────
function _wzEsc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function _wzMd(md) {
  // Mini-markdown : headings, listes, tables, gras, italic, code
  var lines = _wzEsc(md).split('\n'), html = [], inTable = false;
  function flushTable() {
    if (inTable) { html.push('</tbody></table>'); inTable = false; }
  }
  lines.forEach(function(l, i) {
    var trimmed = l.trim();
    // Table row detection: starts and ends with |
    if (trimmed.startsWith('|') && trimmed.endsWith('|')) {
      var cells = trimmed.slice(1,-1).split('|').map(function(c){return c.trim();});
      // Separator row (---|---|---) → skip, used to open thead
      if (cells.every(function(c){return /^[-:]+$/.test(c);})) return;
      if (!inTable) {
        // Check if next line is a separator → first row is header
        var nextTrimmed = (lines[i+1]||'').trim();
        var isHeader = nextTrimmed.startsWith('|') && nextTrimmed.slice(1,-1).split('|').every(function(c){return /^[-:\s]+$/.test(c);});
        html.push('<table class="wz-md-table"><thead><tr>'+cells.map(function(c){return '<th>'+c+'</th>';}).join('')+'</tr></thead><tbody>');
        inTable = true;
        if (isHeader) return; // first row rendered as header
      }
      html.push('<tr>'+cells.map(function(c){return '<td>'+c+'</td>';}).join('')+'</tr>');
      return;
    }
    flushTable();
    if      (l.startsWith('### ')) html.push('<h3>'+l.slice(4)+'</h3>');
    else if (l.startsWith('## '))  html.push('<h2>'+l.slice(3)+'</h2>');
    else if (l.startsWith('# '))   html.push('<h1>'+l.slice(2)+'</h1>');
    else if (l.startsWith('- '))   html.push('<li>'+l.slice(2)+'</li>');
    else if (trimmed==='')         html.push('');
    else                           html.push('<p>'+l+'</p>');
  });
  flushTable();
  return html.join('\n')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/`(.+?)`/g,'<code>$1</code>');
}

function _wzRenderBody(step, cid) {
  var c = _wzEsc(cid||step.id||'');
  switch (step.type) {
    case 'plan':    return _wzPlan(step, c);
    case 'choice':  return _wzChoice(step, c);
    case 'form':    return _wzForm(step, c);
    case 'confirm': return _wzConfirm(step, c);
    case 'progress':return _wzProgress(step);
    case 'info':    return _wzInfo(step, c);
    case 'input':   return _wzInput(step, c);
    case 'preview':      return _wzPreview(step, c);
    case 'data-import':  return _wzDataImport(step, c);
    default:        return '<pre style="font-size:.72rem;color:var(--text2)">'+_wzEsc(JSON.stringify(step,null,2))+'</pre>';
  }
}

function _wzPlan(step, cid) {
  var ICONS = {success:'✓ ',info:'ℹ ',warn:'⚠ ',code:'',default:''};
  var h = '';
  if (typeof step.progress === 'number')
    h += '<div class="ctx-progress"><div class="ctx-progress-fill" style="width:'
      +Math.max(0,Math.min(100,step.progress))+'%"></div></div>';
  if ((step.sections||[]).length) {
    h += '<div class="ctx-sections">';
    step.sections.forEach(function(s){
      var st = s.style||'default';
      h += '<div class="ctx-section '+st+'">';
      if (s.label) h += '<span class="ctx-label">'+_wzEsc(s.label)+'</span>';
      h += '<span class="ctx-content">'+(ICONS[st]||'')+_wzEsc(s.content||'')+'</span></div>';
    });
    h += '</div>';
  }
  if (step.input) {
    h += '<textarea id="wz-ta-'+cid+'" class="wz-input wz-request-ta" placeholder="'+_wzEsc(step.input)+'" style="margin-top:10px"></textarea>';
    h += '<div class="wz-actions"><button class="wz-btn secondary" onclick="closeWizardCard(\''+cid+'\')">Annuler</button>'
      + '<button class="wz-btn primary" onclick="wzPlanInput(\''+cid+'\')">Envoyer</button></div>';
  }
  if ((step.actions||[]).length) {
    h += '<div class="wz-actions">';
    step.actions.forEach(function(a,i){
      h += '<button class="wz-btn '+(a.style||'secondary')+'" onclick="wzPost(\''+cid+'\',\'action\',{value:\''+_wzEsc(a.value||a.label)+'\'})">'+_wzEsc(a.label)+'</button>';
    });
    h += '</div>';
  }
  return h;
}
function wzPlanInput(cid) {
  var ta = document.getElementById('wz-ta-'+cid);
  if (ta && ta.value.trim()) wzPost(cid,'input',{text:ta.value.trim()});
}

function _wzChoice(step, cid) {
  var multi = !!step.multi;
  var html = '<div class="wz-choices">';
  (step.choices||[]).forEach(function(c) {
    var choiceId = _wzEsc(c.id||'');
    html += '<button class="wz-choice" data-cid="'+choiceId+'" onclick="wzChoiceClick(this,\''+cid+'\','+multi+')">';
    if (c.icon) html += '<span class="wz-choice-icon">'+c.icon+'</span>';
    html += '<span class="wz-choice-label">'+_wzEsc(c.label||c.id)+'</span>';
    if (c.desc) html += '<span class="wz-choice-desc">'+_wzEsc(c.desc)+'</span>';
    html += '</button>';
  });
  html += '</div>';
  if (multi) html += '<div class="wz-actions"><button class="wz-btn primary" onclick="wzSubmitChoice(\''+cid+'\',true)">Valider</button></div>';
  return html;
}

function wzChoiceClick(el, cid, multi) {
  if (multi) {
    el.classList.toggle('selected');
  } else {
    wzSubmitChoice(cid, false, el.dataset.cid);
  }
}

function wzSubmitChoice(cid, multi, singleId) {
  var cardEl = document.querySelector('.wz-card[data-wid="'+cid+'"]');
  var selected = multi
    ? Array.from(cardEl?cardEl.querySelectorAll('.wz-choice.selected'):document.querySelectorAll('.wz-choice.selected')).map(function(e){return e.dataset.cid;})
    : singleId;
  wzPost(cid, 'choice', {selected: selected});
}

function _wzForm(step, sid) {
  var html = '<form class="wz-form" onsubmit="wzSubmitForm(event,\''+sid+'\');return false;">';
  (step.fields||[]).forEach(function(f) {
    var fid = _wzEsc(f.id||'');
    html += '<div class="wz-field">';
    if (f.type !== 'toggle') {
      html += '<label class="wz-label" for="wzf-'+fid+'">'+_wzEsc(f.label||f.id)+(f.required?'<span class="wz-required"> *</span>':'')+'</label>';
    }
    var ph = _wzEsc(f.placeholder||'');
    var req = f.required?' required':'';
    switch (f.type) {
      case 'textarea':
        html += '<textarea class="wz-input" id="wzf-'+fid+'" name="'+fid+'" placeholder="'+ph+'" rows="4"'+req+'></textarea>';
        break;
      case 'number':
        html += '<input type="number" class="wz-input" id="wzf-'+fid+'" name="'+fid+'" placeholder="'+ph+'"'+req+'>';
        break;
      case 'select':
        html += '<select class="wz-input" id="wzf-'+fid+'" name="'+fid+'"'+req+'>';
        (f.options||[]).forEach(function(o) {
          var ov = (typeof o==='object')?_wzEsc(o.id||o.label||o):_wzEsc(o);
          var ol = (typeof o==='object')?_wzEsc(o.label||o.id||o):_wzEsc(o);
          html += '<option value="'+ov+'">'+ol+'</option>';
        });
        html += '</select>';
        break;
      case 'toggle':
        html += '<label class="wz-toggle"><input type="checkbox" id="wzf-'+fid+'" name="'+fid+'">'
          + '<span class="wz-toggle-track"></span>'
          + '<span class="wz-toggle-label">'+_wzEsc(f.label||f.id)+'</span></label>';
        break;
      default: // text
        html += '<input type="text" class="wz-input" id="wzf-'+fid+'" name="'+fid+'" placeholder="'+ph+'"'+req+'>';
    }
    if (f.hint) html += '<div class="wz-hint">'+_wzEsc(f.hint)+'</div>';
    html += '</div>';
  });
  html += '<div class="wz-actions"><button type="submit" class="wz-btn primary">Valider</button></div></form>';
  return html;
}

function wzSubmitForm(event, cid) {
  var vals = {};
  var missing = [];
  event.target.querySelectorAll('[name]').forEach(function(el) {
    var v = (el.type==='checkbox') ? el.checked : el.value.trim();
    if (el.required && !v && el.type !== 'checkbox') {
      missing.push(el.name);
      el.style.borderColor = '#ef4444';
    } else {
      el.style.borderColor = '';
      vals[el.name] = (el.type==='checkbox') ? el.checked : el.value;
    }
  });
  if (missing.length) {
    var errEl = event.target.querySelector('.wz-form-error');
    if (!errEl) {
      errEl = document.createElement('div');
      errEl.className = 'wz-form-error';
      errEl.style.cssText = 'color:#ef4444;font-size:12px;margin-top:4px';
      event.target.querySelector('.wz-actions').before(errEl);
    }
    errEl.textContent = 'Champs requis : ' + missing.join(', ');
    return;
  }
  wzPost(cid, 'form', vals);
}

function _wzConfirm(step, cid) {
  var html = '';
  if (step.content) html += '<div class="wz-confirm-content">'+_wzMd(step.content)+'</div>';
  var actions = step.actions||[{id:'ok',label:'Valider',style:'primary'}];
  html += '<div class="wz-actions">';
  actions.forEach(function(a) {
    html += '<button class="wz-btn '+(a.style||'secondary')+'" onclick="wzPost(\''+cid+'\',\'confirm\',{action:\''+_wzEsc(a.id)+'\'})">'+_wzEsc(a.label)+'</button>';
  });
  html += '</div>';
  return html;
}

function _wzProgress(step) {
  var icons = {done:'✓', active:'→', pending:'·', error:'✗'};
  var html = '';
  if (typeof step.progress === 'number')
    html += '<div class="ctx-progress"><div class="ctx-progress-fill" style="width:'
      +Math.max(0,Math.min(100,step.progress))+'%"></div></div>';
  if ((step.sections||[]).length) {
    html += '<div class="ctx-sections">';
    step.sections.forEach(function(s) {
      var st = s.style||'default';
      html += '<div class="ctx-section '+st+'">';
      if (s.label) html += '<span class="ctx-label">'+_wzEsc(s.label)+'</span>';
      html += '<span class="ctx-content">'+_wzEsc(s.content||'')+'</span></div>';
    });
    html += '</div>';
  }
  html += '<div class="wz-progress">';
  (step.steps||[]).forEach(function(s) {
    var st = s.status||'pending';
    html += '<div class="wz-progress-step '+st+'">'
      + '<span class="wz-step-icon">'+(icons[st]||'·')+'</span>'
      + '<span>'+_wzEsc(s.label)+'</span></div>';
  });
  html += '</div>';
  if (step.input) {
    html += '<textarea id="wz-ta-'+_wzEsc(step.id||'')+'" class="wz-input wz-request-ta" placeholder="'+_wzEsc(step.input)+'" style="margin-top:10px"></textarea>';
    html += '<div class="wz-actions"><button class="wz-btn primary" onclick="wzPlanInput(\''+_wzEsc(step.id||'')+'\')">Envoyer</button></div>';
  }
  if ((step.actions||[]).length) {
    html += '<div class="wz-actions">';
    step.actions.forEach(function(a) {
      html += '<button class="wz-btn '+(a.style||'secondary')+'" onclick="wzPost(\''+_wzEsc(step.id||'')+'\',\'action\',{value:\''+_wzEsc(a.value||a.label)+'\'})">'+_wzEsc(a.label)+'</button>';
    });
    html += '</div>';
  }
  return html;
}

function _wzInfo(step, cid) {
  var ICONS = {success:'✓ ',info:'ℹ ',warn:'⚠ ',code:'',default:''};
  var html = '';
  if (typeof step.progress === 'number')
    html += '<div class="ctx-progress"><div class="ctx-progress-fill" style="width:'
      +Math.max(0,Math.min(100,step.progress))+'%"></div></div>';
  if (step.content) html += '<div class="wz-info-content">'+_wzEsc(step.content)+'</div>';
  if ((step.sections||[]).length) {
    html += '<div class="ctx-sections">';
    step.sections.forEach(function(s){
      var st = s.style||'default';
      html += '<div class="ctx-section '+st+'">';
      if (s.label) html += '<span class="ctx-label">'+_wzEsc(s.label)+'</span>';
      html += '<span class="ctx-content">'+(ICONS[st]||'')+_wzEsc(s.content||'')+'</span></div>';
    });
    html += '</div>';
  }
  var actions = step.actions||[];
  if (actions.length) {
    html += '<div class="wz-actions">';
    actions.forEach(function(a) {
      html += '<button class="wz-btn '+(a.style||'primary')+'" onclick="wzPost(\''+cid+'\',\'action\',{value:\''+_wzEsc(a.value||a.label||a.id)+'\'})">'+_wzEsc(a.label)+'</button>';
    });
    html += '</div>';
  }
  return html;
}

function _wzInput(step, cid) {
  var html = '';
  if (step.context) html += '<div class="wz-info-content" style="margin-bottom:4px">'+_wzEsc(step.context)+'</div>';
  var ph  = _wzEsc(step.placeholder||'Décrivez votre demande…');
  var lbl = _wzEsc(step.submit_label||'Envoyer');
  html += '<form onsubmit="wzSubmitInput(event,\''+cid+'\');return false;">';
  html += '<textarea class="wz-input wz-request-ta" id="wz-req-ta-'+cid+'" placeholder="'+ph+'" rows="4" required autofocus></textarea>';
  if ((step.suggestions||[]).length) {
    html += '<div class="wz-suggestions">';
    step.suggestions.forEach(function(s) {
      html += '<button type="button" class="wz-suggestion" onclick="wzSuggestion(\''+cid+'\',\''+_wzEsc(s)+'\')">'+_wzEsc(s)+'</button>';
    });
    html += '</div>';
  }
  html += '<div class="wz-actions"><button type="submit" class="wz-btn primary">'+lbl+'</button></div></form>';
  return html;
}

function wzSubmitInput(event, cid) {
  var ta = document.getElementById('wz-req-ta-'+cid);
  var text = ta ? ta.value.trim() : '';
  if (!text) return;
  wzPost(cid, 'input', {text: text});
}

function wzSuggestion(cid, text) {
  var ta = document.getElementById('wz-req-ta-'+cid);
  if (ta) { ta.value = text; ta.focus(); }
}

// ── DATA-IMPORT ────────────────────────────────────────────────────────────
function _wzGet(obj, path) {
  // Accès chemin imbriqué : "centre.coordinates[1]" → obj.centre.coordinates[1]
  return (path||'').split(/[\.\[\]]+/).filter(Boolean).reduce(function(o,k){
    return o != null ? o[isNaN(k)?k:+k] : undefined;
  }, obj);
}

function _wzDataImport(step, cid) {
  _wzDiState[cid] = {step: step, data: [], selected: new Set()};
  var src = step.source || {};
  var html = '<div class="wz-di-bar">';
  (src.params||[]).forEach(function(p) {
    html += '<input class="wz-input" id="wzdi-p-'+cid+'-'+_wzEsc(p.id)+'" placeholder="'+_wzEsc(p.label||p.id)+'" onkeydown="if(event.key===\'Enter\')wzDiSearch(\''+cid+'\')" style="flex:1;min-width:80px">';
  });
  html += '<button class="wz-btn primary" onclick="wzDiSearch(\''+cid+'\')">Rechercher</button></div>';
  html += '<div class="wz-di-prog" id="wzdi-prog-'+cid+'" style="display:none"><div class="wz-di-prog-fill" id="wzdi-progf-'+cid+'" style="width:0%"></div></div>';
  html += '<div class="wz-di-status" id="wzdi-st-'+cid+'"></div>';
  html += '<div class="wz-di-table-wrap" id="wzdi-tw-'+cid+'" style="display:none">';
  html += '<table class="wz-di-table"><thead><tr>';
  html += '<th><input type="checkbox" id="wzdi-chkall-'+cid+'" onchange="wzDiToggleAll(\''+cid+'\',this.checked)"></th>';
  (step.columns||[]).forEach(function(col) {
    html += '<th>'+_wzEsc(col.label||col.key)+'</th>';
  });
  html += '</tr></thead><tbody id="wzdi-tb-'+cid+'"></tbody></table></div>';
  html += '<div class="wz-actions" id="wzdi-act-'+cid+'" style="display:none">';
  html += '<button class="wz-btn secondary" onclick="wzDiToggleAll(\''+cid+'\',true)">Tout</button>';
  html += '<button class="wz-btn secondary" onclick="wzDiToggleAll(\''+cid+'\',false)">Aucun</button>';
  html += '<button class="wz-btn primary" id="wzdi-ibtn-'+cid+'" onclick="wzDiImport(\''+cid+'\')">Importer <span id="wzdi-cnt-'+cid+'">0</span> lignes</button>';
  html += '</div>';
  return html;
}

async function wzDiSearch(cid) {
  var st = _wzDiState[cid]; if (!st) return;
  var src = st.step.source || {};
  var params = {};
  (src.params||[]).forEach(function(p) {
    var el = document.getElementById('wzdi-p-'+cid+'-'+p.id);
    if (el && el.value.trim()) params[p.id] = el.value.trim();
  });
  Object.assign(params, src.static_params||{});
  // Substitution de template {param_id} dans l'URL
  var url = src.api;
  var usedInTemplate = {};
  Object.keys(params).forEach(function(k) {
    if (url.indexOf('{'+k+'}') >= 0) { url = url.replace('{'+k+'}', encodeURIComponent(params[k])); usedInTemplate[k] = true; }
  });
  // Paramètres non utilisés dans le template → ajoutés en query string
  var extra = {};
  Object.keys(params).forEach(function(k) { if (!usedInTemplate[k]) extra[k] = params[k]; });
  if (Object.keys(extra).length > 0) url += (url.indexOf('?') >= 0 ? '&' : '?') + new URLSearchParams(extra).toString();
  _wzDiSetStatus(cid, 'Recherche…', '');
  _wzDiSetProg(cid, 10, true);
  try {
    var r = await fetch(url);
    if (!r.ok) throw new Error('HTTP '+r.status);
    var items = await r.json();
    _wzDiSetProg(cid, 80);
    st.data = items;
    st.selected = new Set(items.map(function(_,i){return i;}));
    _wzDiRenderTable(cid);
    _wzDiSetProg(cid, 100);
    _wzDiSetStatus(cid, items.length+' résultat(s)', 'ok');
    setTimeout(function(){_wzDiSetProg(cid,0,false);}, 600);
  } catch(e) {
    _wzDiSetStatus(cid, 'Erreur : '+e.message, 'err');
    _wzDiSetProg(cid, 0, false);
  }
}

function _wzDiRenderTable(cid) {
  var st = _wzDiState[cid]; if (!st) return;
  var tbody = document.getElementById('wzdi-tb-'+cid);
  if (!tbody) return;
  var cols = st.step.columns||[];
  tbody.innerHTML = '';
  st.data.forEach(function(row, i) {
    var tr = document.createElement('tr');
    var cells = '<td><input type="checkbox" '+(st.selected.has(i)?'checked':'')+' onchange="wzDiToggleRow(\''+cid+'\','+i+',this.checked)"></td>';
    cols.forEach(function(col) {
      var val = _wzGet(row, col.key);
      if (val == null) val = '—';
      var disp = (typeof val === 'number') ? val.toLocaleString('fr-FR') : String(val);
      cells += '<td title="'+_wzEsc(disp)+'">'+_wzEsc(disp)+'</td>';
    });
    tr.innerHTML = cells;
    tbody.appendChild(tr);
  });
  document.getElementById('wzdi-tw-'+cid).style.display = '';
  document.getElementById('wzdi-act-'+cid).style.display = '';
  _wzDiUpdateCount(cid);
}

function wzDiToggleRow(cid, i, checked) {
  var st = _wzDiState[cid]; if (!st) return;
  if (checked) st.selected.add(i); else st.selected.delete(i);
  _wzDiUpdateCount(cid);
}
function wzDiToggleAll(cid, checked) {
  var st = _wzDiState[cid]; if (!st) return;
  st.selected = checked ? new Set(st.data.map(function(_,i){return i;})) : new Set();
  var tbody = document.getElementById('wzdi-tb-'+cid);
  if (tbody) tbody.querySelectorAll('input[type=checkbox]').forEach(function(cb){cb.checked=checked;});
  var ca = document.getElementById('wzdi-chkall-'+cid); if (ca) ca.checked = checked;
  _wzDiUpdateCount(cid);
}
function _wzDiUpdateCount(cid) {
  var st = _wzDiState[cid]; if (!st) return;
  var n = st.selected.size;
  var cnt = document.getElementById('wzdi-cnt-'+cid); if (cnt) cnt.textContent = n;
  var btn = document.getElementById('wzdi-ibtn-'+cid); if (btn) btn.disabled = n===0;
}

async function wzDiImport(cid) {
  var st = _wzDiState[cid]; if (!st) return;
  var tgt = st.step.target||{}; var tbl = tgt.table; var map = tgt.mapping||{};
  var rows = Array.from(st.selected).map(function(i){return st.data[i];});
  if (!rows.length || !tbl) return;
  _wzDiSetStatus(cid, 'Import de '+rows.length+' lignes…', '');
  _wzDiSetProg(cid, 20, true);
  document.getElementById('wzdi-ibtn-'+cid).disabled = true;
  try {
    var fields = {};
    Object.keys(map).forEach(function(col) {
      fields[col] = rows.map(function(r){ return _wzGet(r, map[col]) ?? null; });
    });
    await grist.docApi.applyUserActions([['BulkAddRecord', tbl, rows.map(function(){return null;}), fields]]);
    _wzDiSetProg(cid, 100);
    _wzDiSetStatus(cid, '✓ '+rows.length+' lignes importées dans '+tbl, 'ok');
    setTimeout(function(){_wzDiSetProg(cid,0,false);}, 800);
    wzPost(cid, 'import', {imported: rows.length, table: tbl});
  } catch(e) {
    _wzDiSetStatus(cid, 'Erreur import : '+e.message, 'err');
    _wzDiSetProg(cid, 0, false);
    document.getElementById('wzdi-ibtn-'+cid).disabled = false;
  }
}

function _wzDiSetStatus(cid, msg, cls) {
  var el = document.getElementById('wzdi-st-'+cid);
  if (el) { el.textContent = msg; el.className = 'wz-di-status'+(cls?' '+cls:''); }
}
function _wzDiSetProg(cid, pct, show) {
  var bar = document.getElementById('wzdi-prog-'+cid);
  var fill = document.getElementById('wzdi-progf-'+cid);
  if (bar && show !== undefined) bar.style.display = show ? '' : 'none';
  if (fill) fill.style.width = pct+'%';
}

function _wzPreview(step, cid) {
  var code     = step.code      || '';
  var ctype    = step.code_type || 'html';
  var height   = parseInt(step.height) || 260;
  var useBridge= step.bridge !== false;

  // Script wizard bridge avec card_id injecté
  var wzScript = '<script>' + WIZARD_PREVIEW_SCRIPT.replace('__CARD_ID__', cid) + '<' + '/script>';

  function _injectWzScript(html) {
    return html.includes('</head>') ? html.replace('</head>', wzScript+'</head>') : wzScript+html;
  }

  // Préparer le srcdoc selon le type
  var srcdoc;
  if (!code) {
    srcdoc = '<!DOCTYPE html><html><body style="margin:0;display:flex;align-items:center;justify-content:center;height:100%;background:#f8fafc;color:#94a3b8;font-family:Inter,sans-serif;font-size:.8rem">Aucun code fourni</body></html>';
  } else if (ctype === 'mermaid') {
    var _mmdHtml = '<!DOCTYPE html><html><head><meta charset="UTF-8">'
      + '<style>body{margin:0;background:#f8fafc;padding:20px;box-sizing:border-box}'
      + '.mermaid{background:#fff;border-radius:8px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.08)}'
      + '</style></head><body>'
      + '<div class="mermaid">'+code+'</div>'
      + '<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js" onload="mermaid.initialize({startOnLoad:false,theme:\'neutral\'});mermaid.run()"><\/script>'
      + '</body></html>';
    // Use base64 data attr + post-process srcdoc assignment to avoid attribute escaping issues
    srcdoc = 'data:mmd:' + btoa(unescape(encodeURIComponent(_mmdHtml)));
    if (!step.height) height = 420;
  } else if (ctype === 'react') {
    srcdoc = _injectWzScript(prepareReactHTML(code, {state: _sharedState, route: '/'}));
  } else if (ctype === 'html' || ctype === 'grist') {
    srcdoc = useBridge ? _injectWzScript(prepareWidgetHTML(code, {state: _sharedState, route: '/'}))
                       : code;
  } else if (ctype === 'svg') {
    var svgHtml = '<!DOCTYPE html><html><head><meta charset="UTF-8"><style>body{margin:0;display:flex;align-items:center;justify-content:center;background:#f8fafc;min-height:100%}</style></head><body>' + code + '</body></html>';
    srcdoc = _injectWzScript(useBridge ? prepareWidgetHTML(svgHtml, {state:_sharedState}) : svgHtml);
  } else {
    var wrap = '<!DOCTYPE html><html><head><meta charset="UTF-8"><style>body{margin:0;padding:16px;font-family:Inter,sans-serif;background:#f8fafc;font-size:.84rem;line-height:1.6;color:#1e293b}</style></head><body>' + code + '</body></html>';
    srcdoc = _injectWzScript(useBridge ? prepareWidgetHTML(wrap, {state:_sharedState}) : wrap);
  }

  // Always use base64 + direct srcdoc assignment (avoids all HTML attribute escaping issues)
  var _b64srcdoc = (srcdoc.indexOf('data:mmd:') === 0)
    ? srcdoc.slice(9)
    : btoa(unescape(encodeURIComponent(srcdoc)));
  var html = '<div class="wz-preview-wrap">'
    + '<iframe data-srcdoc-b64="' + _b64srcdoc + '" sandbox="allow-scripts allow-same-origin allow-forms"'
    + ' style="height:' + height + 'px" title="Aperçu composant"></iframe>'
    + '</div>';

  // Interaction contextuelle en dessous
  var hasChoices = (step.choices||[]).length > 0;
  var hasFields  = (step.fields ||[]).length > 0;
  var hasInput   = !!step.input;
  var hasActions = (step.actions||[]).length > 0;

  if (hasChoices || hasFields || hasInput || hasActions) {
    html += '<div class="wz-preview-sep"></div>';
    if (hasChoices) html += _wzChoice(step, cid);
    else if (hasFields) html += _wzForm(step, cid);
    else if (hasInput) html += _wzInput(step, cid);
    if (hasActions && !hasChoices && !hasFields && !hasInput) {
      html += '<div class="wz-actions" id="wzact-'+cid+'">';
      step.actions.forEach(function(a) {
        var aId = _wzEsc(a.value||a.id||a.label);
        if (a.input_on) {
          var ph = _wzEsc(a.placeholder||'Votre commentaire…');
          html += '<button class="wz-btn '+(a.style||'secondary')+'" onclick="wzRevealInput(\''+_wzEsc(cid)+'\',\''+aId+'\',\''+ph+'\')">'
            + _wzEsc(a.label) + '</button>';
        } else {
          html += '<button class="wz-btn '+(a.style||'secondary')+'" onclick="wzPost(\''+_wzEsc(cid)+'\',\'action\',{value:\''+aId+'\'})">'
            + _wzEsc(a.label) + '</button>';
        }
      });
      html += '</div>';
    }
  }
  return html;
}

function wzRevealInput(cid, actionId, placeholder) {
  var wrap = document.getElementById('wzact-'+cid);
  if (!wrap) return;
  wrap.innerHTML =
    '<textarea id="wzrev-'+cid+'" rows="3" placeholder="'+placeholder+'" style="width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid #cbd5e1;border-radius:8px;font-family:inherit;font-size:.83rem;resize:vertical;background:#f8fafc;color:#1e293b"></textarea>'
    + '<div style="display:flex;gap:8px;margin-top:8px">'
    + '<button class="wz-btn primary" onclick="wzRevealSubmit(\''+cid+'\',\''+actionId+'\')">Envoyer</button>'
    + '<button class="wz-btn secondary" onclick="wzPost(\''+cid+'\',\'action\',{value:\''+actionId+'\'})">Sans commentaire</button>'
    + '</div>';
  setTimeout(function(){ var t=document.getElementById('wzrev-'+cid); if(t) t.focus(); }, 50);
}
function wzRevealSubmit(cid, actionId) {
  var t = document.getElementById('wzrev-'+cid);
  var comment = t ? t.value.trim() : '';
  wzPost(cid, 'action', {value: actionId, comment: comment});
}

function updatePlanChip(ctx) {
  // Phase chip is now inside the plan banner — update it there
  var chip = document.getElementById('pbChip');
  if (!chip) return;
  var labels = {qualifying:'Qualif.',assessing:'Explore',designing:'Design',
    building:'Build',verifying:'Vérif.',done:'Livré'};
  chip.textContent = labels[ctx] || ctx || '';
}

function appendChatMsg(role, text) {
  var msgs = document.getElementById('chatMsgs');
  if (!msgs) return;
  var sec = document.getElementById('chatSection');
  if (sec) sec.classList.add('active');
  document.getElementById('statusPanel').style.display = 'block';
  var div = document.createElement('div');
  div.className = 'wz-msg ' + (role === 'user' ? 'user' : 'assistant');
  var initials = role === 'user' ? 'U' : 'AI';
  div.innerHTML =
    '<div class="wz-msg-avatar">'+initials+'</div>' +
    '<div class="wz-msg-bubble">'+(role==='user'?_wzEsc(text):_wzMd(text))+'</div>';
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

async function sendChat() {
  var inp = document.getElementById('chatInput');
  if (!inp || !inp.value.trim() || inp.disabled) return;
  var text = inp.value.trim();
  inp.value = '';
  inp.style.height = '';
  try {
    await fetch(BASE+'/chat/'+_token, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({message: text})
    });
  } catch(e) { showToast('Erreur chat: '+e.message, 'error'); }
}

function _wzUpdateChatState() {
  var inp = document.getElementById('chatInput');
  var btn = document.getElementById('chatSend');
  if (!inp || !btn) return;
  var hasBlocking = _wzOrder.some(function(id){
    var c = _wzCards[id]; return c && _wzIsBlocking(c.step);
  });
  inp.disabled = hasBlocking;
  btn.disabled = hasBlocking;
  inp.placeholder = hasBlocking ? 'Réponds au formulaire ci-dessus…' : 'Message…';
}

async function wzPost(cid, type, values) {
  closeWizardCard(cid);
  try {
    await fetch(BASE+'/wizard/'+_token, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({step_id: cid, type: type, values: values})
    });
  } catch(e) { showToast('Erreur: '+e.message, 'error'); }
}
